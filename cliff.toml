# git-cliff configuration for Gondwana
# Generates release notes from BOTH PR merge commits and direct commits to master.
# Docs: https://git-cliff.org/docs/

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}\
# v{{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%B %d, %Y") }}
{% else %}\
# [Unreleased]
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}{% if commit.remote.pr_number and commit.message is not containing(pat="github.com/Isthimius/Gondwana/pull/") %} ([#{{ commit.remote.pr_number }}](https://github.com/Isthimius/Gondwana/pull/{{ commit.remote.pr_number }})){% endif %}
{% endfor %}

{% endfor %}
"""
trim = false
postprocessors = []

[git]
# Conventional commits get parsed cleanly, but direct/non-conventional commits are NOT filtered out.
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"

# Convert GitHub squash-merge PR suffixes to links, then strip author/co-author trailers.
# Open PR commits do not have the (#123) suffix yet; GitHub Actions enables remote
# metadata below so the changelog template can append their PR link instead.
commit_preprocessors = [
    { pattern = "\\A([^\\r\\n]*?)\\s*\\(#(\\d+)\\)(\\r?\\n|$)", replace = "$1 ([#$2](https://github.com/Isthimius/Gondwana/pull/$2))$3" },
    { pattern = "(?m)^Co-authored-by:.*\r?\n?", replace = "" },
    { pattern = "(?m)^Agent-Logs-Url:.*\r?\n?", replace = "" },
    { pattern = "(?m)^Signed-off-by:.*\r?\n?", replace = "" },
]

# Group conventional commits first. Anything else falls through to Other Changes.
commit_parsers = [
    { message = "(?i)changelog", skip = true },
    { message = "(?i)\\[skip release notes\\]", skip = true },
    { message = "^docs: update changelog", skip = true },
    { message = "^Potential fix for pull request finding$", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^build", group = "<!-- 6 -->Build" },
    { message = "^ci", group = "<!-- 7 -->CI" },
    { message = "^chore", group = "<!-- 8 -->Maintenance" },
    { message = "^revert", group = "<!-- 9 -->Reverted" },
    { body = ".*security", group = "<!-- 10 -->Security" },
    { message = "^Merge (pull request|branch)", skip = true },
    { message = ".*", group = "<!-- 99 -->Other Changes" },
]

# Keep local changelog/release generation deterministic and independent of GitHub.
# The PR workflow overrides remote.offline and supplies its read-only GITHUB_TOKEN
# so git-cliff can resolve the number of an open PR before it is squash-merged.
[remote]
offline = true

[remote.github]
owner = "Isthimius"
repo = "Gondwana"
