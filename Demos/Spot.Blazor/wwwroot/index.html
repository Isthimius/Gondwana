<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Spot!</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="assets/spot_ico.png" />
    <link rel="stylesheet" href="Spot.Blazor.styles.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: cornflowerblue;
            font-family: sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
        }

        .loading-progress {
            position: relative;
            display: block;
            width: 8rem;
            height: 8rem;
            margin: 20vh auto 1rem;
        }

        .loading-progress circle {
            fill: none;
            stroke: #e0e0e0;
            stroke-width: 0.6rem;
            transform-origin: 50% 50%;
            transform: rotate(-90deg);
        }

        .loading-progress circle:last-child {
            stroke: #1b6ec2;
            stroke-dasharray: calc(3.141 * var(--blazor-load-percentage, 0%) * 0.8), 500%;
            transition: stroke-dasharray 0.05s ease-in-out;
        }

        .loading-progress-text {
            position: absolute;
            text-align: center;
            font-weight: bold;
            inset: calc(20vh + 3.25rem) 0 auto;
            font-size: 1.25rem;
        }

        .loading-progress-text::after {
            content: var(--blazor-load-percentage-text, "Loading");
        }

        #blazor-error-ui {
            background: lightyellow;
            bottom: 0;
            box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.2);
            display: none;
            left: 0;
            padding: 0.6rem 1.25rem 0.7rem;
            position: fixed;
            width: 100%;
            z-index: 1000;
        }

        #blazor-error-ui .dismiss {
            cursor: pointer;
            position: absolute;
            right: 0.75rem;
            top: 0.5rem;
        }

        /* Game layout */
        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .game-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(100, 149, 237, 0.55);
            z-index: 10;
        }

        .setup-panel {
            background: rgba(100, 149, 237, 0.95);
            border: 2px solid white;
            border-radius: 8px;
            padding: 20px 24px;
            color: white;
            min-width: 340px;
        }

        .setup-title {
            margin: 0 0 14px;
            font-size: 1.6rem;
            text-align: center;
        }

        .setup-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .setup-row label {
            font-weight: bold;
        }

        .setup-row select,
        .setup-row input {
            background: rgba(255,255,255,0.9);
            border: 1px solid white;
            border-radius: 4px;
            padding: 3px 6px;
            color: #222;
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 4px;
            padding: 5px 8px;
            flex-wrap: wrap;
        }

        .player-row.hidden {
            display: none;
        }

        .player-label {
            font-weight: 600;
            min-width: 58px;
        }

        .player-name {
            background: rgba(255,255,255,0.9);
            border: 1px solid white;
            border-radius: 4px;
            padding: 3px 6px;
            color: #222;
            min-width: 90px;
        }

        .player-row select {
            background: rgba(255,255,255,0.9);
            border: 1px solid white;
            border-radius: 4px;
            padding: 3px 6px;
            color: #222;
        }

        .start-btn {
            background: white;
            color: #1a4d8c;
            border: none;
            border-radius: 4px;
            padding: 8px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            min-width: 140px;
        }

        .start-btn:disabled {
            opacity: 0.55;
            cursor: default;
        }

        .start-btn:not(:disabled):hover {
            background: #dde8f8;
        }

        .error-msg {
            color: #ffd0d0;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
