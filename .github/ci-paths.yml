# Shared change filters for CI (master). Keep conservative shared-dependency
# coverage; narrow per-editor filters below control which Windows suites run.
changelog:
  - 'Tooling/scripts/*Changelog*.ps1'
  - 'Tooling/scripts/release.ps1'
  - 'Tooling/scripts/Extract-ReleaseNotes.ps1'
  - 'Tooling/scripts/Prepare-PrereleaseTemplates.ps1'
  - 'Tooling/scripts/Test-PrereleaseTemplateReferences.ps1'
  - 'cliff.toml'
  - '.github/workflows/ci-master.yml'
  - '.github/workflows/changelog-weekly.yml'
  - '.github/workflows/release.yml'
  - '.github/ci-paths.yml'

blazor:
  # Actual projects packed by Testing/BlazorConsumer/Run.ps1 (plus CLI assets).
  # Demo-only changes use demo-tests; do not rerun NuGet consumer integration.
  - 'Gondwana/**'
  - 'Gondwana.Widgets/**'
  - 'Gondwana.Hosting/**'
  - 'Gondwana.Blazor/**'
  - 'Gondwana.Blazor.Hosting/**'
  - 'Gondwana.Audio.Browser/**'
  - 'Tooling/Gondwana.Tooling.Assets/**'
  - 'Tooling/Gondwana.Cli/**'
  - 'Tooling/Gondwana.Templates/**'
  - 'Testing/BlazorConsumer/**'
  - 'Testing/BlazorPresentationTests.mjs'
  - 'Testing/browser-audio.test.mjs'
  - 'assets/**'
  - 'Directory.Build.props'
  - 'Directory.Build.targets'
  - 'Gondwana.sln'
  - 'global.json'
  - 'version.json'
  - '.github/actions/**'
  - '.github/workflows/ci-master.yml'
  - '.github/ci-paths.yml'

# Job-level gate: Studio tooling changes only on PRs/master. Unrelated
# engine/runtime/build changes are covered by the full nightly/manual/release run.
winforms:
  - 'Tooling/Studio/**'
  # Tooling dependencies maintained alongside Studio.
  - 'Tooling/Gondwana.Tooling.Assets/**'
  - 'Tooling/Gondwana.Tooling.Importers/**'
  # Changes to these test projects or their shared fixtures are direct test inputs.
  - 'Testing/Gondwana.Tooling.*.Tests/**'
  - 'Testing/Shared/**'
  - 'Testing/WinFormsEditorTests.slnf'

# Studio-shared code/test infrastructure affects every Windows editor suite.
# Engine/runtime/build/CI changes deliberately do not select the full PR suite.
winforms_shared:
  - 'Tooling/Studio/Shared/**'
  - 'Tooling/Studio/Gondwana.Tooling.Studio.Core/**'
  - 'Tooling/Studio/Gondwana.Tooling.Studio.Assets.WinForms/**'
  - 'Tooling/Gondwana.Tooling.Assets/**'
  - 'Testing/Shared/**'
  - 'Testing/WinFormsEditorTests.slnf'

# Direct editor tests. Keep transitive test/project references in these lists.
winforms_tilesheets:
  - 'Tooling/Studio/Gondwana.Tooling.Studio.Tilesheets.WinForms/**'
  - 'Tooling/Studio/Gondwana.Tooling.Studio.Assets.WinForms/**'
  - 'Tooling/Studio/Gondwana.Tooling.Studio.Animations.WinForms/**'
  - 'Testing/Gondwana.Tooling.Tilesheets.WinForms.Tests/**'

winforms_animations:
  - 'Tooling/Studio/Gondwana.Tooling.Studio.Animations.WinForms/**'
  - 'Testing/Gondwana.Tooling.Animations.WinForms.Tests/**'

winforms_audio:
  - 'Tooling/Studio/Gondwana.Tooling.Studio.Audio.WinForms/**'
  - 'Testing/Gondwana.Tooling.Audio.WinForms.Tests/**'

winforms_scenes:
  - 'Tooling/Studio/Gondwana.Tooling.Studio.Scenes.WinForms/**'
  - 'Testing/Gondwana.Tooling.Scenes.WinForms.Tests/**'

winforms_sprites:
  - 'Tooling/Studio/Gondwana.Tooling.Studio.Sprites.WinForms/**'
  - 'Testing/Gondwana.Tooling.Sprites.WinForms.Tests/**'

winforms_scene_viewer:
  - 'Tooling/Studio/Gondwana.Tooling.Studio.SceneViewer.WinForms/**'
  - 'Testing/Gondwana.Tooling.SceneViewer.WinForms.Tests/**'

# Studio references all standalone editors plus the plugin/asset/importer layers.
winforms_studio:
  - 'Tooling/Studio/**'
  - 'Tooling/Gondwana.Tooling.Assets/**'
  - 'Tooling/Gondwana.Tooling.Importers/**'
  - 'Testing/Gondwana.Tooling.Studio.WinForms.Tests/**'
  - 'Testing/Gondwana.Tooling.Importers.Tests/Fixtures/**'

winforms_importers:
  - 'Tooling/Gondwana.Tooling.Importers/**'
  - 'Testing/Gondwana.Tooling.Importers.Tests/**'

# Demo-only test runs: select the owning demo when its sources/assets or
# its dedicated tests change. Engine/global changes are covered nightly.
# Add a new filter and demo-tests step for future demo suites.
demo:
  - 'Demos/Gondwana.Asteroids.*/**'
  - 'Testing/Asteroids.Tests/**'
  - 'Demos/Spot.*/**'
  - 'Testing/Spot.Tests/**'
  - 'Demos/Gondwana.Platformer/**'
  - 'Testing/Platformer.Tests/**'
  - 'Demos/Slider.WinForms/**'
  - 'Demos/Slider.Blazor/**'
  - 'Demos/Slider.Shared/**'
  - 'Testing/Slider.Tests/**'

demo_spot:
  - 'Demos/Spot.*/**'
  - 'Testing/Spot.Tests/**'

demo_platformer:
  - 'Demos/Gondwana.Platformer/**'
  - 'Testing/Platformer.Tests/**'


demo_slider:
  - 'Demos/Slider.WinForms/**'
  - 'Demos/Slider.Blazor/**'
  - 'Demos/Slider.Shared/**'
  - 'Testing/Slider.Tests/**'

demo_asteroids:
  - 'Demos/Gondwana.Asteroids.*/**'
  - 'Testing/Asteroids.Tests/**'
