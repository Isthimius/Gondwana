# Match a non-CHANGELOG file within each rule, not the generated changelogs.
# Keep each positive glob paired with its exclusion so mixed PRs still match.
gondwana-core:
  - changed-files:
    - all-globs-to-any-file:
      - 'Gondwana/**'
      - '!**/CHANGELOG.md'

gondwana-widgets:
  - changed-files:
    - all-globs-to-any-file:
      - 'Gondwana.Widgets/**'
      - '!**/CHANGELOG.md'

gondwana-avalonia:
  - changed-files:
    - all-globs-to-any-file:
      - 'Gondwana.Avalonia/**'
      - '!**/CHANGELOG.md'
    - all-globs-to-any-file:
      - 'Gondwana.Avalonia.Hosting/**'
      - '!**/CHANGELOG.md'

gondwana-blazor:
  - changed-files:
    - all-globs-to-any-file:
      - 'Gondwana.Blazor/**'
      - '!**/CHANGELOG.md'
    - all-globs-to-any-file:
      - 'Gondwana.Blazor.Hosting/**'
      - '!**/CHANGELOG.md'

gondwana-winforms:
  - changed-files:
    - all-globs-to-any-file:
      - 'Gondwana.WinForms/**'
      - '!**/CHANGELOG.md'
    - all-globs-to-any-file:
      - 'Gondwana.WinForms.Hosting/**'
      - '!**/CHANGELOG.md'

# All audio implementation/extension packages share the Gondwana audio family label.
gondwana-audio:
  - changed-files:
    - all-globs-to-any-file:
      - 'Gondwana.Audio*/**'
      - '!**/CHANGELOG.md'

gondwana-hosting:
  - changed-files:
    - all-globs-to-any-file:
      - 'Gondwana.Hosting/**'
      - '!**/CHANGELOG.md'

gondwana-input:
  - changed-files:
    - all-globs-to-any-file:
      - 'Gondwana.Input.SDL2/**'
      - '!**/CHANGELOG.md'

gondwana-video:
  - changed-files:
    - all-globs-to-any-file:
      - 'Gondwana.Video*/**'
      - '!**/CHANGELOG.md'

gondwana-cli:
  - changed-files:
    - all-globs-to-any-file:
      - 'Tooling/Gondwana.Cli/**'
      - '!**/CHANGELOG.md'

gondwana-templates:
  - changed-files:
    - all-globs-to-any-file:
      - 'Tooling/Gondwana.Templates/**'
      - '!**/CHANGELOG.md'

# Specific tooling project/family labels accompany the broader `tooling` label.
# Match matching test projects too, so test-only PRs retain component ownership.
# Every positive rule excludes generated changelog files.
gondwana-mcp:
  - changed-files:
    - all-globs-to-any-file:
      - 'Tooling/Gondwana.Mcp/**'
      - '!**/CHANGELOG.md'

gondwana-assets:
