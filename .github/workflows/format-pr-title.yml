name: Format PR Title

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  format-title:
    runs-on: ubuntu-latest

    # Only run on PRs targeting master, and skip the changelog commit PR if
    # one is ever opened (the release script commits directly, but just in case).
    if: |
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.title, 'docs: update changelog')

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch (shallow + merge base for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch master for diff base
        run: git fetch origin master --depth=50

      - name: Build diff and commit summary
        id: context
        run: |
          BASE=$(git merge-base origin/master HEAD)

          # File-level change summary (max 60 lines to stay within token budget)
          DIFF_STAT=$(git diff "$BASE"...HEAD --stat | head -60)

          # Commit messages on this branch (max 30)
          COMMITS=$(git log "$BASE"...HEAD --oneline | head -30)

          OUTPUT_DELIM=$(uuidgen)

          {
            echo "diff_stat<<$OUTPUT_DELIM"
            printf '%s\n' "$DIFF_STAT"
            echo "$OUTPUT_DELIM"
            echo "commits<<$OUTPUT_DELIM"
            printf '%s\n' "$COMMITS"
            echo "$OUTPUT_DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Generate PR title via GitHub Models
        id: generate
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          DIFF_STAT="${{ steps.context.outputs.diff_stat }}"
          COMMITS="${{ steps.context.outputs.commits }}"

          PROMPT=$(cat <<EOF
          You are a commit message author for the Gondwana game engine, a C#/.NET 8 cross-platform 2.5D engine.

          Review the full set of changes currently in this pull request and generate:
          1. A single conventional commit message suitable as the GitHub PR squash-merge title.

          Rules:
          - The title must follow: type(scope): short description
          - Valid types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert
          - Valid scopes (pick the best fit): rendering, input, audio, wasm, hosting, cli, templates, demos, assets, video, winforms, avalonia, midi, sdl2, core
          - Title description: imperative mood, lowercase, no period, max 60 chars
          - Breaking change: append ! after scope, e.g. feat(rendering)!
          - Return ONLY this format:
            TITLE: <commit message>

          Commits on this branch:
          $COMMITS

          Changed files:
          $DIFF_STAT
          EOF
          )

          REQUEST_BODY=$(python3 -c "
          import sys, json
          prompt = sys.stdin.read()
          print(json.dumps({
            'model': 'gpt-4o-mini',
            'messages': [{'role': 'user', 'content': prompt}],
            'max_tokens': 500,
            'temperature': 0.3
          }))
          " <<< "$PROMPT")

          API_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://models.inference.ai.azure.com/chat/completions" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY" 2>/dev/null || echo "")

          HTTP_STATUS=$(printf '%s' "$API_RESPONSE" | tail -1)
          RESPONSE_BODY=$(printf '%s' "$API_RESPONSE" | head -n -1)

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning::GitHub Models API returned HTTP $HTTP_STATUS. Skipping PR title update."
            RAW=""
          else
            RAW=$(printf '%s' "$RESPONSE_BODY" \
              | python3 -c 'import sys, json; d=json.load(sys.stdin); print(d.get("choices", [{}])[0].get("message", {}).get("content", ""))' \
              2>/dev/null || echo "")
          fi

          if [ -z "$RAW" ]; then
            echo "::warning::GitHub Models API call failed. Skipping PR title update."
            echo "title=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PARSED=$(printf '%s' "$RAW" | python3 -c "$(cat <<'PY'
          import sys, re, json
          text = sys.stdin.read().strip()
          title = ''

          m = re.search(r'TITLE:\s*(.+)', text)
          if m:
              title = m.group(1).strip().strip('"').strip("'")

          if not title:
              m = re.search(r'git commit -m ["\'](.*?)["\']', text, re.DOTALL)
              if m:
                  title = m.group(1).strip().splitlines()[0].strip()

          if not title:
              for line in text.splitlines():
                  line = line.strip().strip('"').strip("'")
                  if re.match(r'^[a-z]+(\([a-z0-9._-]+\))?!?: .', line):
                      title = line
                      break

          print(json.dumps({"title": title}))
          PY
          )" 2>/dev/null || echo '{}')

          TITLE=$(printf '%s' "$PARSED" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("title", ""))' 2>/dev/null || echo "")
          # Basic sanity check: must match conventional commit pattern
          if echo "$TITLE" | grep -qE '^[a-z]+(\([a-z0-9._-]+\))?!?: .{3,}'; then
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
            echo "Generated title: $TITLE"
          else
            echo "::warning::Generated title did not pass validation: '$TITLE'. Skipping update."
            echo "title=" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PR title
        if: steps.generate.outputs.title != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_TITLE: ${{ steps.generate.outputs.title }}
        run: |
          CURRENT_TITLE="${{ github.event.pull_request.title }}"

          # Lock title once it is in conventional commit format.
          if echo "$CURRENT_TITLE" | grep -qE '^[a-z]+(\([a-z0-9._-]+\))?!?: .{3,}'; then
            echo "PR title is already conventional. Skipping update."
            exit 0
          fi

          if [ "$CURRENT_TITLE" = "$NEW_TITLE" ]; then
            echo "PR title is already correct. No update needed."
            exit 0
          fi

          echo "Updating PR #$PR_NUMBER title:"
          echo "  From: $CURRENT_TITLE"
          echo "  To:   $NEW_TITLE"

          gh pr edit "$PR_NUMBER" --title "$NEW_TITLE"
