name: Format PR Title

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  format-title:
    runs-on: ubuntu-latest

    # Only run on PRs targeting master, and skip the changelog commit PR if
    # one is ever opened (the release script commits directly, but just in case).
    if: |
      github.event.pull_request.base.ref == 'master' &&
      !startsWith(github.event.pull_request.title, 'docs: update changelog')

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch (shallow + merge base for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch master for diff base
        run: git fetch origin master --depth=50

      - name: Build diff and commit summary
        id: context
        run: |
          BASE=$(git merge-base origin/master HEAD)

          # File-level change summary (max 60 lines to stay within token budget)
          DIFF_STAT=$(git diff "$BASE"...HEAD --stat | head -60)

          # Commit messages on this branch (max 30)
          COMMITS=$(git log "$BASE"...HEAD --oneline | head -30)

          # Escape for JSON: replace newlines with \n, escape quotes
          escape_json() {
            printf '%s' "$1" \
              | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))" \
              | sed 's/^"//;s/"$//'
          }

          echo "diff_stat=$(escape_json "$DIFF_STAT")" >> "$GITHUB_OUTPUT"
          echo "commits=$(escape_json "$COMMITS")"     >> "$GITHUB_OUTPUT"

      - name: Install GitHub Copilot CLI
        run: gh extension install github/gh-copilot 2>/dev/null || gh extension upgrade gh-copilot 2>/dev/null || true

      - name: Generate conventional commit title via GitHub Copilot
        id: generate
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          DIFF_STAT="${{ steps.context.outputs.diff_stat }}"
          COMMITS="${{ steps.context.outputs.commits }}"

          PROMPT=$(cat <<EOF
          You are a commit message author for the Gondwana game engine, a C#/.NET 8 cross-platform 2.5D engine.

          Generate a single conventional commit message suitable as a GitHub PR squash-merge title.

          Rules:
          - Format: type(scope): short description
          - Valid types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert
          - Valid scopes (pick the best fit): rendering, input, audio, wasm, hosting, cli, templates, demos, assets, video, winforms, avalonia, midi, sdl2, core
          - Description: imperative mood, lowercase, no period, max 60 chars
          - Breaking change: append ! after scope, e.g. feat(rendering)!
          - Return ONLY the commit message string. No explanation, no markdown, no quotes.

          Commits on this branch:
          $COMMITS

          Changed files:
          $DIFF_STAT
          EOF
          )

          RAW=$(printf '%s' "$PROMPT" | gh copilot suggest -t git -p 2>/dev/null || echo "")

          if [ -z "$RAW" ]; then
            echo "::warning::GitHub Copilot CLI call failed. Skipping PR title update."
            echo "title=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TITLE=$(printf '%s' "$RAW" | python3 -c "$(cat <<'PY'
          import sys, re
          text = sys.stdin.read().strip()
          # Try to extract message from: git commit -m 'msg' or git commit -m "msg"
          m = re.search(r'git commit -m ["\'](.*?)["\']', text, re.DOTALL)
          if m:
              print(m.group(1).strip().splitlines()[0].strip())
              sys.exit()
          # Fallback: look for a line that already looks like a conventional commit
          for line in text.splitlines():
              line = line.strip().strip('"').strip("'")
              if re.match(r'^[a-z]+(\([a-z0-9._-]+\))?!?: .', line):
                  print(line)
                  sys.exit()
          print('')
          PY
          )" 2>/dev/null || echo "")

          # Basic sanity check: must match conventional commit pattern
          if echo "$TITLE" | grep -qE '^[a-z]+(\([a-z0-9._-]+\))?!?: .{3,}'; then
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
            echo "Generated title: $TITLE"
          else
            echo "::warning::Generated title did not pass validation: '$TITLE'. Skipping update."
            echo "title=" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PR title
        if: steps.generate.outputs.title != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_TITLE: ${{ steps.generate.outputs.title }}
        run: |
          CURRENT_TITLE="${{ github.event.pull_request.title }}"

          if [ "$CURRENT_TITLE" = "$NEW_TITLE" ]; then
            echo "PR title is already correct. No update needed."
            exit 0
          fi

          echo "Updating PR #$PR_NUMBER title:"
          echo "  From: $CURRENT_TITLE"
          echo "  To:   $NEW_TITLE"

          gh pr edit "$PR_NUMBER" --title "$NEW_TITLE"

      - name: Post summary comment
        if: steps.generate.outputs.title != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_TITLE: ${{ steps.generate.outputs.title }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🤖 **PR title updated for squash merge:**\n\n\`$NEW_TITLE\`\n\nThis title will become the commit message on master and the changelog entry. Edit it if it doesn't look right before merging." \
            --edit-last 2>/dev/null \
            || gh pr comment "$PR_NUMBER" --body "🤖 **PR title updated for squash merge:**\n\n\`$NEW_TITLE\`\n\nThis title will become the commit message on master and the changelog entry. Edit it if it doesn't look right before merging."
