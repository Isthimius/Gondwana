name: Format PR Title

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

jobs:
  format-title:
    runs-on: ubuntu-latest

    # Only run for same-repository PRs targeting master. This avoids running
    # Copilot against untrusted fork content under pull_request_target.
    if: |
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.title, 'docs: update changelog')

    permissions:
      contents: read
      pull-requests: write
      copilot-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Fetch master for diff base
        run: git fetch origin master --depth=50

      - name: Inspect current PR state
        id: state
        env:
          CURRENT_TITLE: ${{ github.event.pull_request.title }}
          CURRENT_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          title = os.environ.get("CURRENT_TITLE", "").strip()
          body = os.environ.get("CURRENT_BODY", "").strip()

          conventional_title = re.fullmatch(
              r"[a-z]+(?:\([a-z0-9._-]+\))?!?: .{3,}",
              title,
          ) is not None

          print(f"needs_title={'false' if conventional_title else 'true'}")
          print(f"needs_body={'false' if body else 'true'}")
          PY

      - name: Build diff and commit summary
        id: context
        if: steps.state.outputs.needs_title == 'true' || steps.state.outputs.needs_body == 'true'
        run: |
          BASE=$(git merge-base origin/master HEAD)

          # File-level change summary, capped to keep the prompt reasonably small.
          DIFF_STAT=$(git diff "$BASE"...HEAD --stat | head -60)

          # Commit messages on this branch, capped for the same reason.
          COMMITS=$(git log "$BASE"...HEAD --oneline | head -30)

          OUTPUT_DELIM=$(uuidgen)

          {
            echo "diff_stat<<$OUTPUT_DELIM"
            printf '%s\n' "$DIFF_STAT"
            echo "$OUTPUT_DELIM"
            echo "commits<<$OUTPUT_DELIM"
            printf '%s\n' "$COMMITS"
            echo "$OUTPUT_DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Generate PR title with GitHub Copilot
        id: generate_title
        if: steps.state.outputs.needs_title == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIFF_STAT: ${{ steps.context.outputs.diff_stat }}
          COMMITS: ${{ steps.context.outputs.commits }}
        run: |
          PROMPT=$(cat <<EOF
          You are a commit-message author for the Gondwana game engine, a C#/.NET 8 cross-platform 2.5D engine.

          Review the commit list and changed-file summary below. Generate one conventional commit title suitable for the pull request's squash-merge commit.

          Rules:
          - Format: type(scope): short description
          - Valid types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert
          - Preferred scopes: rendering, scenes, input, audio, collisions, physics, tilesheets, widgets, wasm, hosting, cli, templates, demos, assets, video, winforms, avalonia, blazor, studio, tooling, midi, sdl2, core
          - A different concise lowercase scope is allowed when it fits better
          - Use imperative mood
          - Keep the description lowercase
          - Do not end with a period
          - Keep the description at or below 60 characters
          - For a breaking change, append ! after the scope
          - Return exactly one line in this format:
            TITLE: type(scope): short description
          - Do not use tools; all required context is included below

          Commits on this branch:
          $COMMITS

          Changed files:
          $DIFF_STAT
          EOF
          )

          if ! RAW=$(copilot -p "$PROMPT" \
            -s \
            --model auto \
            --no-ask-user \
            --no-color \
            --no-custom-instructions); then
            echo "::warning::Copilot CLI failed while generating the PR title."
            RAW=""
          fi

          TITLE=$(printf '%s' "$RAW" | python3 -c "$(cat <<'PY'
          import re
          import sys

          text = sys.stdin.read().strip()
          title = ""

          match = re.search(r"(?im)^\s*TITLE:\s*(.+?)\s*$", text)
          if match:
              title = match.group(1).strip().strip('"').strip("'")

          if not title:
              for line in text.splitlines():
                  candidate = line.strip().strip('"').strip("'")
                  if re.fullmatch(r"[a-z]+(?:\([a-z0-9._-]+\))?!?: .{3,}", candidate):
                      title = candidate
                      break

          valid_types = "feat|fix|perf|refactor|docs|test|build|ci|chore|revert"
          pattern = re.compile(
              rf"^(?:{valid_types})\([a-z0-9._-]+\)!?: (?P<description>.+)$"
          )
          valid = pattern.fullmatch(title)

          if valid:
              description = valid.group("description")
              if (
                  3 <= len(description) <= 60
                  and description == description.lower()
                  and not description.endswith(".")
              ):
                  print(title)
          PY
          )" 2>/dev/null || true)

          if [ -z "$TITLE" ]; then
            FALLBACK_TITLE=$(printf '%s\n' "$COMMITS" \
              | sed -E 's/^[0-9a-f]{7,}[[:space:]]+//' \
              | grep -m1 -E '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .{3,}' \
              || true)

            if [ -z "$FALLBACK_TITLE" ]; then
              FALLBACK_TITLE="chore(core): update pull request"
            fi

            echo "::warning::Copilot did not return a valid title. Using fallback '$FALLBACK_TITLE'."
            TITLE="$FALLBACK_TITLE"
          fi

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Selected title: $TITLE"

      - name: Generate PR description with GitHub Copilot
        id: generate_description
        if: steps.state.outputs.needs_body == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMITS: ${{ steps.context.outputs.commits }}
          DIFF_STAT: ${{ steps.context.outputs.diff_stat }}
        run: |
          PROMPT=$(cat <<EOF
          You are writing the Summary section for a pull request in the Gondwana game engine repository.

          Using only the commit list and changed-file summary below, infer the most likely pull request intent and produce concise summary bullets.

          Rules:
          - Return 2 to 4 Markdown bullet points
          - Each bullet must start with "- "
          - Do not include a heading
          - Keep each bullet under 120 characters
          - Focus on user-visible behavior and important technical changes
          - Do not use tools; all required context is included below

          Commits on this branch:
          $COMMITS

          Changed files:
          $DIFF_STAT
          EOF
          )

          if ! RAW_SUMMARY=$(copilot -p "$PROMPT" \
            -s \
            --model auto \
            --no-ask-user \
            --no-color \
            --no-custom-instructions); then
            echo "::warning::Copilot CLI failed while generating the PR description."
            RAW_SUMMARY=""
          fi

          SUMMARY_BULLETS=$(printf '%s' "$RAW_SUMMARY" | python3 -c "$(cat <<'PY'
          import re
          import sys

          lines = []

          for raw in sys.stdin.read().splitlines():
              line = raw.strip()

              if not line or line.startswith("```"):
                  continue

              if line.lower().startswith("summary"):
                  continue

              if line.startswith(("-", "*")):
                  line = line[1:].strip()
              elif re.match(r"^\d+[.)]\s+", line):
                  line = re.sub(r"^\d+[.)]\s+", "", line)
              else:
                  continue

              if line:
                  lines.append(f"- {line[:117].rstrip()}")

              if len(lines) == 4:
                  break

          print("\n".join(lines))
          PY
          )")

          if [ -z "$(printf '%s' "$SUMMARY_BULLETS" | tr -d '[:space:]')" ]; then
            SUMMARY_BULLETS=$(printf '%s\n' "$COMMITS" \
              | sed -E 's/^[0-9a-f]{7,}[[:space:]]+//' \
              | grep -vE '^Merge branch ' \
              | head -3 \
              | sed -E 's/^/- /')
          fi

          if [ -z "$(printf '%s' "$SUMMARY_BULLETS" | tr -d '[:space:]')" ]; then
            SUMMARY_BULLETS="- Automated summary was unavailable; please review this pull request before merge."
          fi

          DELIM=$(uuidgen)
          {
            echo "body<<$DELIM"
            printf '%s\n' "$SUMMARY_BULLETS"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR title
        if: steps.generate_title.outputs.title != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_TITLE: ${{ steps.generate_title.outputs.title }}
        run: |
          CURRENT_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title // ""')

          # Preserve a title that someone manually fixed while this job was running.
          if echo "$CURRENT_TITLE" | grep -qE '^[a-z]+(\([a-z0-9._-]+\))?!?: .{3,}'; then
            echo "PR title is already conventional. Skipping update."
            exit 0
          fi

          if [ "$CURRENT_TITLE" = "$NEW_TITLE" ]; then
            echo "PR title is already correct. No update needed."
            exit 0
          fi

          echo "Updating PR #$PR_NUMBER title:"
          echo "  From: $CURRENT_TITLE"
          echo "  To:   $NEW_TITLE"

          gh pr edit "$PR_NUMBER" --title "$NEW_TITLE"

      - name: Update PR description when body is blank
        if: steps.generate_description.outputs.body != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_BODY: ${{ steps.generate_description.outputs.body }}
        run: |
          CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')

          if [ -n "$(printf '%s' "$CURRENT_BODY" | tr -d '[:space:]')" ]; then
            echo "PR description is not blank. Skipping update."
            exit 0
          fi

          if [ -z "$(printf '%s' "$NEW_BODY" | tr -d '[:space:]')" ]; then
            echo "Generated description is blank. Skipping update."
            exit 0
          fi

          echo "Populating blank PR description for #$PR_NUMBER"
          gh pr edit "$PR_NUMBER" --body "$NEW_BODY"
