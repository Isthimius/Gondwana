name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout (full history for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NBGV
        run: dotnet tool install -g nbgv

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Get version from NBGV
        run: echo "VERSION=$(nbgv get-version -v NuGetPackageVersion)" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore --nologo /p:EnableWindowsTargeting=true

      - name: Build
        run: dotnet build -c Release --no-restore --nologo /p:EnableWindowsTargeting=true

      - name: Pack
        run: dotnet pack -c Release --no-build -o ./nupkgs --nologo /p:EnableWindowsTargeting=true

      - name: Publish projects needed for staged binaries
        run: |
          mkdir -p publish/Gondwana
          mkdir -p publish/Gondwana.Audio.Midi
          mkdir -p publish/Gondwana.Hosting
          mkdir -p publish/Gondwana.Input.SDL2
          mkdir -p publish/Gondwana.Video
          mkdir -p publish/Gondwana.WinForms
          mkdir -p publish/Gondwana.WinForms.Hosting
          mkdir -p publish/Tooling/Gondwana.Assets.WinForms
          mkdir -p publish/Demos/Slider
          mkdir -p publish/Demos/Spot

          dotnet publish Gondwana/Gondwana.csproj -c Release -o publish/Gondwana --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Audio.Midi/Gondwana.Audio.Midi.csproj -c Release -o publish/Gondwana.Audio.Midi --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Hosting/Gondwana.Hosting.csproj -c Release -o publish/Gondwana.Hosting --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Input.SDL2/Gondwana.Input.SDL2.csproj -c Release -o publish/Gondwana.Input.SDL2 --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Video/Gondwana.Video.csproj -c Release -o publish/Gondwana.Video --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.WinForms/Gondwana.WinForms.csproj -c Release -o publish/Gondwana.WinForms --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.WinForms.Hosting/Gondwana.WinForms.Hosting.csproj -c Release -o publish/Gondwana.WinForms.Hosting --nologo /p:EnableWindowsTargeting=true
          dotnet publish Tooling/Gondwana.Assets.Winforms/Gondwana.Assets.WinForms.csproj -c Release -o publish/Tooling/Gondwana.Assets.WinForms -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true
          dotnet publish Demos/Slider/Slider.csproj -c Release -o publish/Demos/Slider -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true
          dotnet publish Demos/Spot/Spot.csproj -c Release -o publish/Demos/Spot -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true

      - name: Stage exact downloadable binaries
        shell: bash
        run: |
          mkdir -p release-assets/Tooling
          mkdir -p release-assets/Demos

          cp publish/Gondwana/Gondwana.dll release-assets/
          cp publish/Gondwana.Audio.Midi/Gondwana.Audio.Midi.dll release-assets/
          cp publish/Gondwana.Hosting/Gondwana.Hosting.dll release-assets/
          cp publish/Gondwana.Input.SDL2/Gondwana.Input.SDL2.dll release-assets/
          cp publish/Gondwana.Video/Gondwana.Video.dll release-assets/
          cp publish/Gondwana.WinForms/Gondwana.WinForms.dll release-assets/
          cp publish/Gondwana.WinForms.Hosting/Gondwana.WinForms.Hosting.dll release-assets/

          cp publish/Tooling/Gondwana.Assets.WinForms/Gondwana.Assets.WinForms.exe release-assets/Tooling/
          cp publish/Demos/Slider/Slider.exe release-assets/Demos/
          cp publish/Demos/Spot/Spot.exe release-assets/Demos/

      - name: Zip binaries
        run: |
          cd release-assets
          zip -r ../Gondwana-${{ env.VERSION }}-binaries.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Gondwana ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: Gondwana-${{ env.VERSION }}-binaries.zip

      - name: Push packages to NuGet
        run: |
          find ./nupkgs -name "*.nupkg" ! -name "*.snupkg" -print0 | \
          xargs -0 -I {} dotnet nuget push "{}" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Add GitHub Packages source
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push packages to GitHub Packages
        run: |
          find ./nupkgs -name "*.nupkg" ! -name "*.snupkg" -print0 | \
          xargs -0 -I {} dotnet nuget push "{}" \
            --source github \
            --skip-duplicate

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Inject version into Doxyfile
        run: |
          sed "s/@PROJECT_VERSION@/${VERSION}/g" docs/doxy/Doxyfile > docs/doxy/Doxyfile.gen

      - name: Generate docs
        run: |
          cd docs/doxy
          doxygen Doxyfile.gen

      - name: Publish docs to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          temp_dir=$(mktemp -d)
          cp -R docs/doxy/html/. "$temp_dir"/

          git fetch origin gh-pages || true
          if git ls-remote --exit-code --heads origin gh-pages; then
            git checkout gh-pages || git checkout -b gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          cp -R "$temp_dir"/. .
          touch .nojekyll

          git add .
          git commit -m "Update docs for version $VERSION" || echo "No changes to commit"
          git push origin gh-pages --force