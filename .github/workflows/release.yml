name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout (full history for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NBGV
        run: dotnet tool install -g nbgv

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Get version from NBGV
        run: echo "VERSION=$(nbgv get-version -v NuGetPackageVersion)" >> $GITHUB_ENV

      - name: Create or overwrite release branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          release_branch="release/v${VERSION}"

          git push origin HEAD:refs/heads/${release_branch} --force

      - name: Restore
        run: dotnet restore --nologo /p:Configuration=Release /p:EnableWindowsTargeting=true

      - name: Build
        run: dotnet build -c Release --no-restore --nologo /p:EnableWindowsTargeting=true

      - name: Pack
        run: dotnet pack -c Release --no-build -o ./nupkgs --nologo /p:EnableWindowsTargeting=true

      # ---------------------------
      # Publish
      # ---------------------------
      - name: Publish projects
        run: |
          mkdir -p publish/Gondwana
          mkdir -p publish/Gondwana.Audio.Midi
          mkdir -p publish/Gondwana.Blazor
          mkdir -p publish/Gondwana.Blazor.Hosting
          mkdir -p publish/Gondwana.Hosting
          mkdir -p publish/Gondwana.Input.SDL2
          mkdir -p publish/Gondwana.Video
          mkdir -p publish/Gondwana.Widgets
          mkdir -p publish/Gondwana.WinForms
          mkdir -p publish/Gondwana.WinForms.Hosting
          mkdir -p publish/Tooling/Gondwana.Assets.WinForms
          mkdir -p publish/Tooling/Gondwana.Templates
          mkdir -p publish/Demos/Slider
          mkdir -p publish/Demos/Spot

          dotnet publish Gondwana/Gondwana.csproj -c Release -o publish/Gondwana --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Audio.Midi/Gondwana.Audio.Midi.csproj -c Release -o publish/Gondwana.Audio.Midi --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Blazor/Gondwana.Blazor.csproj -c Release -o publish/Gondwana.Blazor --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Blazor.Hosting/Gondwana.Blazor.Hosting.csproj -c Release -o publish/Gondwana.Blazor.Hosting --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Hosting/Gondwana.Hosting.csproj -c Release -o publish/Gondwana.Hosting --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Input.SDL2/Gondwana.Input.SDL2.csproj -c Release -o publish/Gondwana.Input.SDL2 --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Video/Gondwana.Video.csproj -c Release -o publish/Gondwana.Video --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Widgets/Gondwana.Widgets.csproj -c Release -o publish/Gondwana.Widgets --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.WinForms/Gondwana.WinForms.csproj -c Release -o publish/Gondwana.WinForms --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.WinForms.Hosting/Gondwana.WinForms.Hosting.csproj -c Release -o publish/Gondwana.WinForms.Hosting --nologo /p:EnableWindowsTargeting=true

          # Apps/tools (full folders needed for assets)
          dotnet publish Tooling/Gondwana.Assets.WinForms/Gondwana.Assets.WinForms.csproj -c Release -o publish/Tooling/Gondwana.Assets.WinForms -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true
          dotnet publish Demos/Slider/Slider.csproj -c Release -o publish/Demos/Slider -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true
          dotnet publish Demos/Spot/Spot.csproj -c Release -o publish/Demos/Spot -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true

      # ---------------------------
      # Stage release artifacts
      # ---------------------------
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets/Tooling
          mkdir -p release-assets/Demos

          # Engine DLLs (flat)
          cp publish/Gondwana/Gondwana.dll release-assets/
          cp publish/Gondwana.Audio.Midi/Gondwana.Audio.Midi.dll release-assets/
          cp publish/Gondwana.Blazor/Gondwana.Blazor.dll release-assets/
          cp publish/Gondwana.Blazor.Hosting/Gondwana.Blazor.Hosting.dll release-assets/
          cp publish/Gondwana.Hosting/Gondwana.Hosting.dll release-assets/
          cp publish/Gondwana.Input.SDL2/Gondwana.Input.SDL2.dll release-assets/
          cp publish/Gondwana.Video/Gondwana.Video.dll release-assets/
          cp publish/Gondwana.Widgets/Gondwana.Widgets.dll release-assets/
          cp publish/Gondwana.WinForms/Gondwana.WinForms.dll release-assets/
          cp publish/Gondwana.WinForms.Hosting/Gondwana.WinForms.Hosting.dll release-assets/

          # Apps/tools (FULL folders for assets/runtime)
          cp -r publish/Tooling/Gondwana.Assets.WinForms release-assets/Tooling/
          cp -r publish/Demos/Slider release-assets/Demos/
          cp -r publish/Demos/Spot release-assets/Demos/

      - name: Zip binaries
        run: |
          cd release-assets
          zip -r ../Gondwana-${{ env.VERSION }}-binaries.zip .

      # ---------------------------
      # GitHub Release
      # ---------------------------
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md was not found. Run release.ps1 so git-cliff can update the changelog before tagging."
            exit 1
          fi

          # Pull the newest release section from CHANGELOG.md. The release.ps1
          # script prepends this section before creating the tag, so the tagged
          # commit is the source of truth for the GitHub Release body.
          # Handles both git-cliff format (# [version]) and the legacy repo
          # format (# vX.Y.Z), while ignoring any "# Changelog" header line.
          awk '
            function is_release_heading(line) {
              return line ~ /^# \[/ || line ~ /^# v/
            }

            /^# Changelog[[:space:]]*$/ { next }

            {
              if (is_release_heading($0)) {
                section++
                if (section > 1) exit
              }

              if (section == 1) print
            }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Could not extract release notes from CHANGELOG.md."
            exit 1
          fi

          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Gondwana ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: Gondwana-${{ env.VERSION }}-binaries.zip

      # ---------------------------
      # NuGet (nuget.org)
      # ---------------------------
      - name: Push packages to NuGet
        run: |
          find ./nupkgs -name "*.nupkg" ! -name "*.snupkg" -print0 | \
          xargs -0 -I {} dotnet nuget push "{}" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # ---------------------------
      # GitHub Packages
      # ---------------------------
      - name: Add GitHub Packages source
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push packages to GitHub Packages (best effort)
        shell: bash
        run: |
          failed=0

          while IFS= read -r -d '' pkg; do
            echo "Pushing $pkg to GitHub Packages..."

            if dotnet nuget push "$pkg" \
              --source github \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate \
              --timeout 900 \
              --disable-buffering; then
              echo "Successfully pushed $pkg"
            else
              echo "WARNING: Failed to push $pkg to GitHub Packages"
              failed=1
            fi
          done < <(find ./nupkgs -name "*.nupkg" ! -name "*.snupkg" -print0)

          if [ "$failed" -ne 0 ]; then
            echo "::warning::One or more GitHub Packages uploads failed, but continuing."
          fi

      # ---------------------------
      # Docs (Doxygen)
      # ---------------------------
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Inject version into Doxyfile
        run: |
          sed "s/@PROJECT_VERSION@/v${VERSION}/g" docs/doxy/Gondwana_doxy > docs/doxy/Gondwana_doxy.gen

      - name: Generate docs
        run: |
          cd docs/doxy
          doxygen Gondwana_doxy.gen

      - name: Publish docs to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          temp_dir=$(mktemp -d)
          cp -R docs/. "$temp_dir"/

          ghpages_dir=$(mktemp -d)

          git fetch origin gh-pages || true

          if git ls-remote --exit-code --heads origin gh-pages; then
            git worktree add "$ghpages_dir" origin/gh-pages
          else
            git worktree add --detach "$ghpages_dir"
            (
              cd "$ghpages_dir"
              git checkout --orphan gh-pages
              git rm -rf . || true
            )
          fi

          find "$ghpages_dir" -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          cp -R "$temp_dir"/. "$ghpages_dir"/
          touch "$ghpages_dir/.nojekyll"

          (
            cd "$ghpages_dir"
            git add .
            git commit -m "Update docs for version $VERSION" || echo "No changes"
            git push origin HEAD:gh-pages --force
          )

          git worktree remove "$ghpages_dir" --force
