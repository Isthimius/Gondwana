name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout (full history for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NBGV
        run: dotnet tool install -g nbgv

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Get version from NBGV
        run: echo "VERSION=$(nbgv get-version -v NuGetPackageVersion)" >> $GITHUB_ENV

      - name: Create or overwrite release branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          release_branch="release/v${VERSION}"

          git push origin HEAD:refs/heads/${release_branch} --force

      - name: Restore
        run: dotnet restore --nologo /p:EnableWindowsTargeting=true

      - name: Build
        run: dotnet build -c Release --no-restore --nologo /p:EnableWindowsTargeting=true

      - name: Pack
        run: dotnet pack -c Release --no-build -o ./nupkgs --nologo /p:EnableWindowsTargeting=true

      # ---------------------------
      # Publish
      # ---------------------------
      - name: Publish projects
        run: |
          mkdir -p publish/Gondwana
          mkdir -p publish/Gondwana.Audio.Midi
          mkdir -p publish/Gondwana.Hosting
          mkdir -p publish/Gondwana.Input.SDL2
          mkdir -p publish/Gondwana.Video
          mkdir -p publish/Gondwana.WinForms
          mkdir -p publish/Gondwana.WinForms.Hosting
          mkdir -p publish/Tooling/Gondwana.Assets.WinForms
          mkdir -p publish/Tooling/Gondwana.Templates
          mkdir -p publish/Demos/Slider
          mkdir -p publish/Demos/Spot

          dotnet publish Gondwana/Gondwana.csproj -c Release -o publish/Gondwana --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Audio.Midi/Gondwana.Audio.Midi.csproj -c Release -o publish/Gondwana.Audio.Midi --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Hosting/Gondwana.Hosting.csproj -c Release -o publish/Gondwana.Hosting --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Input.SDL2/Gondwana.Input.SDL2.csproj -c Release -o publish/Gondwana.Input.SDL2 --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Video/Gondwana.Video.csproj -c Release -o publish/Gondwana.Video --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.WinForms/Gondwana.WinForms.csproj -c Release -o publish/Gondwana.WinForms --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.WinForms.Hosting/Gondwana.WinForms.Hosting.csproj -c Release -o publish/Gondwana.WinForms.Hosting --nologo /p:EnableWindowsTargeting=true

          # Apps/tools (full folders needed for assets)
          dotnet publish Tooling/Gondwana.Assets.WinForms/Gondwana.Assets.WinForms.csproj -c Release -o publish/Tooling/Gondwana.Assets.WinForms -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true
          dotnet publish Demos/Slider/Slider.csproj -c Release -o publish/Demos/Slider -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true
          dotnet publish Demos/Spot/Spot.csproj -c Release -o publish/Demos/Spot -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true

      # ---------------------------
      # Stage release artifacts
      # ---------------------------
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets/Tooling
          mkdir -p release-assets/Demos

          # Engine DLLs (flat)
          cp publish/Gondwana/Gondwana.dll release-assets/
          cp publish/Gondwana.Audio.Midi/Gondwana.Audio.Midi.dll release-assets/
          cp publish/Gondwana.Hosting/Gondwana.Hosting.dll release-assets/
          cp publish/Gondwana.Input.SDL2/Gondwana.Input.SDL2.dll release-assets/
          cp publish/Gondwana.Video/Gondwana.Video.dll release-assets/
          cp publish/Gondwana.WinForms/Gondwana.WinForms.dll release-assets/
          cp publish/Gondwana.WinForms.Hosting/Gondwana.WinForms.Hosting.dll release-assets/

          # Apps/tools (FULL folders for assets/runtime)
          cp -r publish/Tooling/Gondwana.Assets.WinForms release-assets/Tooling/
          cp -r publish/Demos/Slider release-assets/Demos/
          cp -r publish/Demos/Spot release-assets/Demos/

      - name: Zip binaries
        run: |
          cd release-assets
          zip -r ../Gondwana-${{ env.VERSION }}-binaries.zip .

      # ---------------------------
      # GitHub Release
      # ---------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Gondwana ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: Gondwana-${{ env.VERSION }}-binaries.zip

      # ---------------------------
      # Update CHANGELOG.md
      # ---------------------------
      - name: Update CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_body=$(gh release view "${{ github.ref_name }}" --json body --jq '.body')

          # Write the changelog processing script to a temp file so it can use
          # single/double quotes freely without shell-escaping nightmares.
          cat > /tmp/process_changelog.py << 'PYEOF'
          import sys, re, collections

          body = sys.stdin.read()
          # Strip HTML comments
          body = re.sub(r'<!--.*?-->', '', body, flags=re.DOTALL)
          # Strip New Contributors section
          body = re.sub(r'^## New Contributors\n(?:\* @[^\n]*\n)*', '', body, flags=re.MULTILINE)
          # Strip author attribution and PR URLs
          body = re.sub(r' by @\S+ in https?://\S+', '', body)
          # Collapse excessive blank lines
          body = re.sub(r'\n{3,}', '\n\n', body).strip()

          # --- Parse sections produced by GitHub release notes ---
          # Format: "## What's Changed" / "### Category" / "* bullet" / "**Full Changelog**: URL"
          sections = collections.OrderedDict()
          full_changelog = ''
          current = None
          for line in body.splitlines():
              if re.match(r'^#+ What', line):
                  continue
              if line.startswith('### '):
                  current = line[4:].strip()
                  sections.setdefault(current, [])
              elif line.startswith('* ') and current is not None:
                  sections[current].append(line)
              elif line.startswith('**Full Changelog**'):
                  full_changelog = line

          # --- Assembly detection ---
          # Maps a conventional-commit scope (the part inside parentheses) to an
          # assembly section title.  None means "keep in Other Changes".
          SCOPE_MAP = {
              'spotavalonia': 'Demos',
              'spot':         'Demos',
              'spotgl':       'Demos',
              'slider':       'Demos',
              'audio':        'Gondwana.Audio.Midi',
              'midi':         'Gondwana.Audio.Midi',
              'avalonia':     'Gondwana.Avalonia',
              'winforms':     'Gondwana.WinForms',
              'hosting':      'Gondwana.Hosting',
              'input':        'Gondwana.Input.SDL2',
              'sdl2':         'Gondwana.Input.SDL2',
              'video':        'Gondwana.Video',
              'cli':          'Gondwana.Cli',
              'templates':    'Gondwana.Templates',
              # Infrastructure scopes stay in Other Changes
              'release': None, 'changelog': None, 'docs': None,
              'ci': None, 'chore': None,
          }

          # Keyword rules applied to the lowercase bullet text when no scope matches.
          # Each entry is (section_title, [regex_patterns]).  First match wins.
          # Gondwana.Cli comes before Gondwana.Avalonia so "gondwana new … avalonia"
          # is attributed to the CLI rather than to the Avalonia library.
          ASSEMBLY_RULES = [
              ('Demos', [
                  r'\bspotavalonia\b', r'\bspotgl\b', r'\bspot\b', r'\bslider\b',
              ]),
              ('Gondwana.Audio.Midi', [
                  r'\baudio\b', r'\bmidi\b',
              ]),
              ('Gondwana.Cli', [
                  r'gondwana\.cli',
                  # 'gondwana templates' here is the CLI sub-command, not the assembly
                  r'gondwana (?:new|pack|doctor|help|templates)\b',
                  r'\bglobal tool\b',
              ]),
              ('Gondwana.Templates', [
                  r'gondwana\.templates', r'\bdotnet new\b', r'\btemplates?\b',
              ]),
              ('Gondwana.Avalonia', [
                  r'gondwana\.avalonia', r'\bavalonia\b',
              ]),
              ('Gondwana.WinForms', [
                  r'gondwana\.winforms', r'\bwinforms\b',
              ]),
              ('Gondwana.Hosting', [
                  r'gondwana\.hosting',
              ]),
              ('Gondwana.Input.SDL2', [
                  r'gondwana\.input', r'\bsdl2?\b',
              ]),
              ('Gondwana.Video', [
                  r'gondwana\.video', r'\bvideo\b',
              ]),
              ('Gondwana (Core)', [
                  r'\bgpubackbuffer\b', r'\bmsaa\b', r'\bvsync\b', r'\bbackbuffer\b',
                  r'\bengine\b', r'\bscene\b',
              ]),
          ]

          def detect_assembly(bullet):
              text = bullet.lstrip('* ').strip()
              # Check for a conventional-commit scope: type(scope): description
              m = re.match(r'^\w+\(([^)]+)\)\s*:', text)
              if m:
                  scope = m.group(1).lower()
                  if scope in SCOPE_MAP:
                      # SCOPE_MAP maps infra scopes (release, changelog, …) to None.
                      # Returning None here causes the caller to bucket the bullet
                      # in "Other Changes" without attempting keyword matching.
                      return SCOPE_MAP[scope]
              # Fall back to keyword matching
              lower = text.lower()
              for title, patterns in ASSEMBLY_RULES:
                  for p in patterns:
                      if re.search(p, lower):
                          return title
              return 'Other Changes'

          # Re-categorize the "Other Changes" bucket by assembly
          other_bullets = sections.pop('Other Changes', [])
          asm_sections = collections.OrderedDict()
          for bullet in other_bullets:
              key = detect_assembly(bullet) or 'Other Changes'
              asm_sections.setdefault(key, []).append(bullet)

          # --- Render output ---
          out = ["## What's Changed", '']
          PRIORITY = ['Breaking Changes', 'New Features', 'Fixes']
          for name in PRIORITY:
              if sections.get(name):
                  out += ['### ' + name] + sections[name] + ['']
          for name, bullets in sections.items():
              if name not in PRIORITY and bullets:
                  out += ['### ' + name] + bullets + ['']
          # Assembly sections derived from re-categorisation; "Other Changes" last
          for name, bullets in asm_sections.items():
              if name != 'Other Changes' and bullets:
                  out += ['### ' + name] + bullets + ['']
          if asm_sections.get('Other Changes'):
              out += ['### Other Changes'] + asm_sections['Other Changes'] + ['']
          if full_changelog:
              out.append(full_changelog)
          print('\n'.join(out).strip())
          PYEOF

          # Clean and group the release notes
          cleaned_body=$(echo "${release_body}" | python3 /tmp/process_changelog.py)

          existing=$(cat CHANGELOG.md 2>/dev/null || true)
          release_date=$(date +'%B %d, %Y')
          # Use a grouped redirect so trailing newlines in the separator are
          # preserved (command substitution would strip them).
          {
            printf '# v%s - %s\n%s\n\n---\n\n' "${VERSION}" "${release_date}" "${cleaned_body}"
            printf '%s' "${existing}"
          } > CHANGELOG.md

      - name: Commit and push CHANGELOG.md
        run: |
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG for v${VERSION}"
          git push origin HEAD:refs/heads/release/v${VERSION}

      # ---------------------------
      # NuGet (nuget.org)
      # ---------------------------
      - name: Push packages to NuGet
        run: |
          find ./nupkgs -name "*.nupkg" ! -name "*.snupkg" -print0 | \
          xargs -0 -I {} dotnet nuget push "{}" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # ---------------------------
      # GitHub Packages
      # ---------------------------
      - name: Add GitHub Packages source
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push packages to GitHub Packages (best effort)
        shell: bash
        run: |
          failed=0

          while IFS= read -r -d '' pkg; do
            echo "Pushing $pkg to GitHub Packages..."

            if dotnet nuget push "$pkg" \
              --source github \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate \
              --timeout 900 \
              --disable-buffering; then
              echo "Successfully pushed $pkg"
            else
              echo "WARNING: Failed to push $pkg to GitHub Packages"
              failed=1
            fi
          done < <(find ./nupkgs -name "*.nupkg" ! -name "*.snupkg" -print0)

          if [ "$failed" -ne 0 ]; then
            echo "::warning::One or more GitHub Packages uploads failed, but continuing."
          fi

      # ---------------------------
      # Docs (Doxygen)
      # ---------------------------
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Inject version into Doxyfile
        run: |
          sed "s/@PROJECT_VERSION@/v${VERSION}/g" docs/doxy/Gondwana_doxy > docs/doxy/Gondwana_doxy.gen

      - name: Generate docs
        run: |
          cd docs/doxy
          doxygen Gondwana_doxy.gen

      - name: Publish docs to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          temp_dir=$(mktemp -d)
          cp -R docs/. "$temp_dir"/

          ghpages_dir=$(mktemp -d)

          git fetch origin gh-pages || true

          if git ls-remote --exit-code --heads origin gh-pages; then
            git worktree add "$ghpages_dir" origin/gh-pages
          else
            git worktree add --detach "$ghpages_dir"
            (
              cd "$ghpages_dir"
              git checkout --orphan gh-pages
              git rm -rf . || true
            )
          fi

          find "$ghpages_dir" -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          cp -R "$temp_dir"/. "$ghpages_dir"/
          touch "$ghpages_dir/.nojekyll"

          (
            cd "$ghpages_dir"
            git add .
            git commit -m "Update docs for version $VERSION" || echo "No changes"
            git push origin HEAD:gh-pages --force
          )

          git worktree remove "$ghpages_dir" --force

      # ---------------------------
      # Push current HEAD to master
      # ---------------------------
      - name: Push current HEAD to master
        run: |
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:refs/heads/master