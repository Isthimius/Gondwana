name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout (full history for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NBGV
        run: dotnet tool install -g nbgv

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Get version from NBGV
        id: version
        run: |
          version="$(nbgv get-version -v NuGetPackageVersion)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate and extract release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ("v$env:VERSION" -ne $env:RELEASE_TAG) {
            throw "Release tag '$env:RELEASE_TAG' does not match package version '$env:VERSION'."
          }
          ./Tooling/scripts/Extract-ReleaseNotes.ps1 -Tag $env:RELEASE_TAG
          Get-Content RELEASE_NOTES.md


  packaging:
    needs: preflight
    uses: ./.github/workflows/package-binaries.yml
    with:
      upload_release_artifacts: true
    permissions:
      contents: read

  release:
    needs: [preflight, packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract validated release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./Tooling/scripts/Extract-ReleaseNotes.ps1 -Tag $env:RELEASE_TAG

      - name: Download validated binaries
        uses: actions/download-artifact@v4
        with:
          name: Gondwana-binaries

      - name: Download validated NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: Gondwana-nupkgs
          path: nupkgs

      - name: Verify release artifacts
        shell: bash
        run: |
          test -s Gondwana-binaries.zip
          test -n "$(find nupkgs -maxdepth 1 -type f -name '*.nupkg' -print -quit)"
          mv Gondwana-binaries.zip "Gondwana-$VERSION-binaries.zip"

      - name: Create or overwrite release branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          release_branch="release/v${VERSION}"

          git push origin HEAD:refs/heads/${release_branch} --force

      # ---------------------------
      # GitHub Release
      # ---------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Gondwana ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: Gondwana-${{ env.VERSION }}-binaries.zip

      # ---------------------------
      # NuGet (nuget.org)
      # ---------------------------
      - name: Push packages to NuGet
        run: |
          find ./nupkgs -name "*.nupkg" ! -name "*.snupkg" -print0 | \
          xargs -0 -I {} dotnet nuget push "{}" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # ---------------------------
      # GitHub Packages
      # ---------------------------
      - name: Add GitHub Packages source
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push packages to GitHub Packages (best effort)
        shell: bash
        run: |
          failed=0

          while IFS= read -r -d '' pkg; do
            echo "Pushing $pkg to GitHub Packages..."

            if dotnet nuget push "$pkg" \
              --source github \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate \
              --timeout 900 \
              --disable-buffering; then
              echo "Successfully pushed $pkg"
            else
              echo "WARNING: Failed to push $pkg to GitHub Packages"
              failed=1
            fi
          done < <(find ./nupkgs -name "*.nupkg" ! -name "*.snupkg" -print0)

          if [ "$failed" -ne 0 ]; then
            echo "::warning::One or more GitHub Packages uploads failed, but continuing."
          fi

  api-docs:
    needs: release
    concurrency:
      group: api-docs-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only vX.Y.Z tags publish stable API documentation"
            exit 1
          fi

      - name: Install Doxygen
        run: bash Tooling/scripts/api-docs/install-doxygen.sh

      - name: Validate API publisher
        run: python3 -m unittest discover -s Tooling/scripts/api-docs -p 'test_*.py' -v

      - name: Generate tagged API docs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 Tooling/scripts/api-docs/build.py --version "Version ${RELEASE_TAG#v}" --output "$RUNNER_TEMP/api-build"

      - name: Publish immutable release and stable entry point
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash Tooling/scripts/api-docs/publish.sh "$RUNNER_TEMP/api-build/html" "$RELEASE_TAG"

      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
