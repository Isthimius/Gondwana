name: Docs

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '!Testing/**'
      - '!Demos/**'
      - '!Tooling/**'
      - '!Games/**'
      - '!Gondwana.Design/**'
      - '!Gondwana.CoordinateTest/**'
      - '!TestHarness/**'
      - 'version.json'
      - 'global.json'
      - 'docs/doxy/**'
      - 'Tooling/scripts/api-docs/**'
      - '.github/workflows/docs.yml'

concurrency:
  group: api-docs-development
  cancel-in-progress: false

jobs:
  docs:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout (full history for NBGV)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NBGV
        run: dotnet tool install -g nbgv

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Get version from NBGV
        run: echo "VERSION=$(nbgv get-version -v NuGetPackageVersion)" >> $GITHUB_ENV

      - name: Validate API publisher
        run: python3 -m unittest discover -s Tooling/scripts/api-docs -p 'test_*.py' -v

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Generate development API docs
        run: python3 Tooling/scripts/api-docs/build.py --version "Development (master) - ${VERSION}" --output "$RUNNER_TEMP/api-build"

      - name: Publish development API docs
        run: bash Tooling/scripts/api-docs/publish.sh "$RUNNER_TEMP/api-build/html" latest
