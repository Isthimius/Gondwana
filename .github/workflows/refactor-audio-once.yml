name: Audio refactor one-time validation

on:
  push:
    branches: [ 20260914_audio_backend_refactor ]
    paths:
      - 'Tooling/scripts/refactor-audio-once.py'

permissions:
  contents: write

jobs:
  apply-and-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20260914_audio_backend_refactor
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply generated edits
        run: |
          dotnet sln Gondwana.sln add Gondwana.Audio.NAudio/Gondwana.Audio.NAudio.csproj
          python3 Tooling/scripts/refactor-audio-once.py

      - name: Validate solution
        run: |
          dotnet workload restore Gondwana.sln /p:EnableWindowsTargeting=true
          dotnet restore --nologo /p:Configuration=Release /p:EnableWindowsTargeting=true
          dotnet build --configuration Release --no-restore --nologo /p:EnableWindowsTargeting=true
          dotnet test --configuration Release --no-build --no-restore --nologo /p:EnableWindowsTargeting=true Testing/Gondwana.Tests/Gondwana.Tests.csproj
          dotnet pack --configuration Release --no-build --nologo /p:EnableWindowsTargeting=true
          node --check Gondwana.Audio.Browser/wwwroot/gondwana-audio.js
          pwsh -NoProfile -File Tooling/scripts/Test-ChangelogConfiguration.ps1
          python3 -m unittest discover -s Tooling/scripts/api-docs -p 'test_*.py' -v

      - name: Persist solution and Doxygen edits
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: 20260914_audio_backend_refactor
        shell: bash
        run: |
          update_file() {
            path="$1"
            message="$2"
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$BRANCH" --jq .sha)
            content=$(base64 -w0 "$path")
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="$message" \
              -f branch="$BRANCH" \
              -f sha="$sha" \
              -f content="$content" >/dev/null
          }

          update_file Gondwana.sln 'chore(audio): add NAudio project to solution'
          update_file docs/doxy/Gondwana_doxy 'docs(api): describe pluggable audio backends'
