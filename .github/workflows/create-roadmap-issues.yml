name: Create Roadmap Issues

# Run once manually to create all 20 roadmap issues from the files in
# .github/roadmap-issues/. After all issues are created you can delete
# this workflow file and the roadmap-issues/ folder.
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create issues from markdown files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          for file in .github/roadmap-issues/*.md; do
            # Extract title from YAML frontmatter (line that starts with "title:")
            title=$(grep -m1 '^title:' "$file" | sed 's/^title: *//; s/^"//; s/"$//')
            if [ -z "$title" ]; then
              echo "SKIP (no title): $file"
              continue
            fi

            # Check if an open issue with this exact title already exists
            existing=$(gh issue list \
              --repo "$REPO" \
              --state open \
              --search "\"$title\" in:title" \
              --limit 1 \
              --json title \
              -q '.[0].title' 2>/dev/null || true)

            if [ "$existing" = "$title" ]; then
              echo "SKIP (already open): $title"
              continue
            fi

            # Strip frontmatter (everything between the first two "---" lines)
            body=$(awk '/^---$/{n++; if(n==2){found=1; next}} found' "$file")

            number=$(gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body "$body" \
              --json number \
              -q '.number')
            echo "Created #$number: $title"
          done
          echo "Done."
