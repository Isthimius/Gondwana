name: Temporary formatting bootstrap

on:
  push:
    branches: [ Isthimius_1 ]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Isthimius_1
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore workloads
        run: dotnet workload restore Gondwana.sln /p:EnableWindowsTargeting=true

      - name: Restore
        run: dotnet restore --nologo /p:Configuration=Release /p:EnableWindowsTargeting=true

      - name: Apply whitespace formatting
        run: dotnet format whitespace Gondwana.sln --no-restore --verbosity minimal

      - name: Commit mechanical formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply dotnet format"
          git push origin HEAD:Isthimius_1
