name: Mirror to Bitbucket

on:
  push:
    branches:
      - master
    tags:
      - '*'
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitbucket-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name != 'delete' || github.event.ref_type == 'tag'
    name: Mirror repository
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BITBUCKET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Clone GitHub repository
        run: |
          set -euo pipefail
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repository.git

      - name: Mirror master and tags to Bitbucket
        run: |
          set -euo pipefail

          cd repository.git

          git push \
            git@bitbucket.org:isthimius/gondwana.git \
            '+refs/heads/master:refs/heads/master'

          git push --prune \
            git@bitbucket.org:isthimius/gondwana.git \
            '+refs/tags/*:refs/tags/*'
