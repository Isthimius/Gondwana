name: CI (master)

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/release.yml'
      - 'CHANGELOG.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/release.yml'
      - 'CHANGELOG.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        # /p:Configuration=Release is required so NuGet resolves RID-specific assets
        # (e.g. Spot win-x64 runtime assets) that are only available in the Release
        # configuration, preventing NETSDK1047 errors in the subsequent --no-restore build.
        run: dotnet restore --nologo /p:Configuration=Release /p:EnableWindowsTargeting=true

      - name: Build
        run: dotnet build --configuration Release --no-restore --nologo /p:EnableWindowsTargeting=true

      - name: Gondwana.Tests unit tests
        run: dotnet test --configuration Release --no-build --no-restore --nologo /p:EnableWindowsTargeting=true Gondwana.Tests/Gondwana.Tests.csproj

      - name: Pack (validation only)
        run: dotnet pack --configuration Release --no-build --nologo /p:EnableWindowsTargeting=true

      - name: Publish projects needed for staged binaries
        run: |
          mkdir -p publish/Gondwana
          mkdir -p publish/Gondwana.Audio.Midi
          mkdir -p publish/Gondwana.Hosting
          mkdir -p publish/Gondwana.Input.SDL2
          mkdir -p publish/Gondwana.Video
          mkdir -p publish/Gondwana.WinForms
          mkdir -p publish/Gondwana.WinForms.Hosting
          mkdir -p publish/Tooling/Gondwana.Assets.WinForms
          mkdir -p publish/Demos/Slider
          mkdir -p publish/Demos/Spot

          dotnet publish Gondwana/Gondwana.csproj -c Release -o publish/Gondwana --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Audio.Midi/Gondwana.Audio.Midi.csproj -c Release -o publish/Gondwana.Audio.Midi --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Hosting/Gondwana.Hosting.csproj -c Release -o publish/Gondwana.Hosting --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Input.SDL2/Gondwana.Input.SDL2.csproj -c Release -o publish/Gondwana.Input.SDL2 --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.Video/Gondwana.Video.csproj -c Release -o publish/Gondwana.Video --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.WinForms/Gondwana.WinForms.csproj -c Release -o publish/Gondwana.WinForms --nologo /p:EnableWindowsTargeting=true
          dotnet publish Gondwana.WinForms.Hosting/Gondwana.WinForms.Hosting.csproj -c Release -o publish/Gondwana.WinForms.Hosting --nologo /p:EnableWindowsTargeting=true
          dotnet publish Tooling/Gondwana.Assets.WinForms/Gondwana.Assets.WinForms.csproj -c Release -o publish/Tooling/Gondwana.Assets.WinForms -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true
          dotnet publish Demos/Slider/Slider.csproj -c Release -o publish/Demos/Slider -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true
          dotnet publish Demos/Spot/Spot.csproj -c Release -o publish/Demos/Spot -r win-x64 --self-contained false --nologo /p:EnableWindowsTargeting=true

      - name: Stage exact downloadable binaries
        shell: bash
        run: |
          mkdir -p artifacts/Tooling
          mkdir -p artifacts/Demos

          cp publish/Gondwana/Gondwana.dll artifacts/
          cp publish/Gondwana.Audio.Midi/Gondwana.Audio.Midi.dll artifacts/
          cp publish/Gondwana.Hosting/Gondwana.Hosting.dll artifacts/
          cp publish/Gondwana.Input.SDL2/Gondwana.Input.SDL2.dll artifacts/
          cp publish/Gondwana.Video/Gondwana.Video.dll artifacts/
          cp publish/Gondwana.WinForms/Gondwana.WinForms.dll artifacts/
          cp publish/Gondwana.WinForms.Hosting/Gondwana.WinForms.Hosting.dll artifacts/

          cp publish/Tooling/Gondwana.Assets.WinForms/Gondwana.Assets.WinForms.exe artifacts/Tooling/
          cp publish/Demos/Slider/Slider.exe artifacts/Demos/
          cp publish/Demos/Spot/Spot.exe artifacts/Demos/

      - name: Zip artifacts
        run: |
          cd artifacts
          zip -r ../Gondwana-binaries.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gondwana-binaries
          path: Gondwana-binaries.zip
