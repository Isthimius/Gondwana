name: CI (master)

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'

permissions:
  contents: read
  actions: read
jobs:
  changelog-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        uses: taiki-e/install-action@d8ae1fa96886bc82c05515b8ac15b41515da2c6d # git-cliff
      - name: Changelog generation and release retry tests
        shell: pwsh
        run: ./Tooling/scripts/Test-ChangelogConfiguration.ps1

  winforms-editor-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Tilesheet WinForms editor interaction tests
        run: dotnet test Testing/Gondwana.Tooling.Tilesheets.WinForms.Tests/Gondwana.Tooling.Tilesheets.WinForms.Tests.csproj --configuration Release --nologo

      - name: Animation WinForms editor interaction tests
        run: dotnet test Testing/Gondwana.Tooling.Animations.WinForms.Tests/Gondwana.Tooling.Animations.WinForms.Tests.csproj --configuration Release --nologo

      - name: Audio WinForms editor interaction tests
        run: dotnet test Testing/Gondwana.Tooling.Audio.WinForms.Tests/Gondwana.Tooling.Audio.WinForms.Tests.csproj --configuration Release --nologo

      - name: Scene WinForms editor interaction tests
        run: dotnet test Testing/Gondwana.Tooling.Scenes.WinForms.Tests/Gondwana.Tooling.Scenes.WinForms.Tests.csproj --configuration Release --nologo

      - name: Sprite WinForms editor interaction tests
        run: dotnet test Testing/Gondwana.Tooling.Sprites.WinForms.Tests/Gondwana.Tooling.Sprites.WinForms.Tests.csproj --configuration Release --nologo

      - name: Scene Viewer runtime loading and camera tests
        run: dotnet test Testing/Gondwana.Tooling.SceneViewer.WinForms.Tests/Gondwana.Tooling.SceneViewer.WinForms.Tests.csproj --configuration Release --nologo

      - name: Studio WinForms composition tests
        run: dotnet test Testing/Gondwana.Tooling.Studio.WinForms.Tests/Gondwana.Tooling.Studio.WinForms.Tests.csproj --configuration Release --nologo

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore workloads
        run: dotnet workload restore Gondwana.sln /p:EnableWindowsTargeting=true
      - name: Restore
        # /p:Configuration=Release is required so NuGet resolves RID-specific assets
        # required by projects whose Release configuration sets a RuntimeIdentifier,
        # preventing NETSDK1047 errors in the subsequent --no-restore build.
        run: dotnet restore --nologo /p:Configuration=Release /p:EnableWindowsTargeting=true

      - name: Verify formatting
        run: dotnet format whitespace Gondwana.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Verify dead-code and using cleanup
        run: dotnet format style Gondwana.sln --verify-no-changes --no-restore --severity warn --diagnostics IDE0005 IDE0059 IDE0051 --verbosity minimal

      - name: Build
        run: dotnet build --configuration Release --no-restore --nologo /p:EnableWindowsTargeting=true

      - name: Gondwana.Tests unit tests
        run: dotnet test --configuration Release --no-build --no-restore --nologo /p:EnableWindowsTargeting=true Testing/Gondwana.Tests/Gondwana.Tests.csproj

      - name: Setup Node for browser presentation tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Browser helper tests
        run: node --test Testing/BlazorPresentationTests.mjs Testing/browser-audio.test.mjs

      - name: Pack (validation only)
        run: dotnet pack --configuration Release --no-build --nologo /p:EnableWindowsTargeting=true
