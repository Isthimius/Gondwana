name: CI (master)

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'

  # All integration suites run nightly and on a manual dispatch.
  schedule:
    - cron: '15 2 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
  # The tagged release workflow calls this same full suite before packaging.
  workflow_call:

# A new PR commit supersedes old CI runs; never cancel release or master runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
jobs:
  blazor-consumer:
    needs: changes
    # Use full packaging/browser smoke tests only for relevant PR/master changes.
    # Manual/nightly/tagged release runs always execute them.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      needs.changes.outputs.blazor == 'true'
    # Match the pinned Playwright browser's supported OS, independent of runner image upgrades.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install .NET 10 WebAssembly workload
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p blazor-workload
          cd blazor-workload
          echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature","allowPrerelease":false}}' > global.json
          dotnet workload install wasm-tools
      - name: Install Chromium system dependencies
        run: npx --yes playwright@1.56.1 install-deps chromium
      - name: Pack, generate and test Blazor NuGet consumer
        shell: pwsh
        run: ./Testing/BlazorConsumer/Run.ps1 -WorkRoot '${{ runner.temp }}/blazor-consumer'
      - name: Upload consumer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blazor-consumer-diagnostics
          path: |
            ${{ runner.temp }}/blazor-consumer/*.binlog
            ${{ runner.temp }}/blazor-consumer/toolchain.txt
            ${{ runner.temp }}/blazor-consumer/compile-items.json
            ${{ runner.temp }}/blazor-consumer/native-items.json
            ${{ runner.temp }}/blazor-consumer/audio.nuspec
            ${{ runner.temp }}/blazor-consumer/app/obj/project.assets.json
            ${{ runner.temp }}/blazor-consumer/browser-results/

  # Keep changelog integration tests off unrelated PRs and master pushes.
  # A separate job is necessary because workflow-level path filters affect all CI jobs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changelog: ${{ steps.filter.outputs.changelog }}
      blazor: ${{ steps.filter.outputs.blazor }}
      winforms: ${{ steps.filter.outputs.winforms }}
      winforms_shared: ${{ steps.filter.outputs.winforms_shared }}
      winforms_tilesheets: ${{ steps.filter.outputs.winforms_tilesheets }}
      winforms_animations: ${{ steps.filter.outputs.winforms_animations }}
      winforms_audio: ${{ steps.filter.outputs.winforms_audio }}
      winforms_scenes: ${{ steps.filter.outputs.winforms_scenes }}
      winforms_sprites: ${{ steps.filter.outputs.winforms_sprites }}
      winforms_scene_viewer: ${{ steps.filter.outputs.winforms_scene_viewer }}
      winforms_studio: ${{ steps.filter.outputs.winforms_studio }}
      winforms_importers: ${{ steps.filter.outputs.winforms_importers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        # The caller's tag event is also a push; only diff actual master pushes.
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        with:
          base: master
          filters: .github/ci-paths.yml

  changelog-tests:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || needs.changes.outputs.changelog == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        uses: taiki-e/install-action@d8ae1fa96886bc82c05515b8ac15b41515da2c6d # git-cliff
      - name: Changelog generation and release retry tests
        shell: pwsh
        run: |
          ./Tooling/scripts/Test-ChangelogConfiguration.ps1
          ./Tooling/scripts/Test-PrereleaseTemplateReferences.ps1

  winforms-editor-tests:
    # Only affected editor suites on PRs/master; full nightly/manual/release.
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      needs.changes.outputs.winforms == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Restore/build only selected test projects and their transitive dependencies.
      - name: Select affected WinForms editor suites
        id: select
        shell: pwsh
        env:
          RUN_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || needs.changes.outputs.winforms_shared == 'true' }}
          TILESHEETS: ${{ needs.changes.outputs.winforms_tilesheets }}
          ANIMATIONS: ${{ needs.changes.outputs.winforms_animations }}
          AUDIO: ${{ needs.changes.outputs.winforms_audio }}
          SCENES: ${{ needs.changes.outputs.winforms_scenes }}
          SPRITES: ${{ needs.changes.outputs.winforms_sprites }}
          SCENE_VIEWER: ${{ needs.changes.outputs.winforms_scene_viewer }}
          STUDIO: ${{ needs.changes.outputs.winforms_studio }}
          IMPORTERS: ${{ needs.changes.outputs.winforms_importers }}
        run: |
          $full = $env:RUN_ALL -eq 'true'
          $flags = @{
            'Gondwana.Tooling.Tilesheets.WinForms.Tests.csproj' = $env:TILESHEETS
            'Gondwana.Tooling.Animations.WinForms.Tests.csproj' = $env:ANIMATIONS
            'Gondwana.Tooling.Audio.WinForms.Tests.csproj' = $env:AUDIO
            'Gondwana.Tooling.Scenes.WinForms.Tests.csproj' = $env:SCENES
            'Gondwana.Tooling.Sprites.WinForms.Tests.csproj' = $env:SPRITES
            'Gondwana.Tooling.SceneViewer.WinForms.Tests.csproj' = $env:SCENE_VIEWER
            'Gondwana.Tooling.Studio.WinForms.Tests.csproj' = $env:STUDIO
            'Gondwana.Tooling.Importers.Tests.csproj' = $env:IMPORTERS
          }
          $source = Get-Content Testing/WinFormsEditorTests.slnf -Raw | ConvertFrom-Json
          $selected = @($source.solution.projects | Where-Object {
            $filename = [IO.Path]::GetFileName($_)
            if (!$flags.ContainsKey($filename)) { throw "Unmapped WinForms test project: $_" }
            $full -or $flags[$filename] -eq 'true'
          })
          if ($selected.Count -eq 0) { throw 'WinForms job started but no test suites were selected.' }
          $source.solution.projects = $selected
          $source | ConvertTo-Json -Depth 4 | Set-Content Testing/SelectedWinFormsEditorTests.slnf
          Write-Host "Selected Windows suites: $($selected -join ', ')"
          $outputs = [ordered]@{
            tilesheets = 'Gondwana.Tooling.Tilesheets.WinForms.Tests.csproj'
            animations = 'Gondwana.Tooling.Animations.WinForms.Tests.csproj'
            audio = 'Gondwana.Tooling.Audio.WinForms.Tests.csproj'
            scenes = 'Gondwana.Tooling.Scenes.WinForms.Tests.csproj'
            sprites = 'Gondwana.Tooling.Sprites.WinForms.Tests.csproj'
            scene_viewer = 'Gondwana.Tooling.SceneViewer.WinForms.Tests.csproj'
            studio = 'Gondwana.Tooling.Studio.WinForms.Tests.csproj'
            importers = 'Gondwana.Tooling.Importers.Tests.csproj'
          }
          foreach ($entry in $outputs.GetEnumerator()) {
            $enabled = (@($selected | Where-Object { [IO.Path]::GetFileName($_) -eq $entry.Value }).Count -gt 0)
            "$($entry.Key)=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          }
      - name: Restore tooling test projects
        run: dotnet restore Testing/SelectedWinFormsEditorTests.slnf --nologo -p:Configuration=Release
      - name: Build tooling test projects
        run: dotnet build Testing/SelectedWinFormsEditorTests.slnf --configuration Release --no-restore --nologo
      - name: Tilesheet WinForms editor interaction tests
        if: ${{ steps.select.outputs.tilesheets == 'true' }}
        run: dotnet test Testing/Gondwana.Tooling.Tilesheets.WinForms.Tests/Gondwana.Tooling.Tilesheets.WinForms.Tests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Animation WinForms editor interaction tests
        if: ${{ steps.select.outputs.animations == 'true' }}
        run: dotnet test Testing/Gondwana.Tooling.Animations.WinForms.Tests/Gondwana.Tooling.Animations.WinForms.Tests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Audio WinForms editor interaction tests
        if: ${{ steps.select.outputs.audio == 'true' }}
        run: dotnet test Testing/Gondwana.Tooling.Audio.WinForms.Tests/Gondwana.Tooling.Audio.WinForms.Tests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Scene WinForms editor interaction tests
        if: ${{ steps.select.outputs.scenes == 'true' }}
        run: dotnet test Testing/Gondwana.Tooling.Scenes.WinForms.Tests/Gondwana.Tooling.Scenes.WinForms.Tests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Sprite WinForms editor interaction tests
        if: ${{ steps.select.outputs.sprites == 'true' }}
        run: dotnet test Testing/Gondwana.Tooling.Sprites.WinForms.Tests/Gondwana.Tooling.Sprites.WinForms.Tests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Scene Viewer runtime loading and camera tests
        if: ${{ steps.select.outputs.scene_viewer == 'true' }}
        run: dotnet test Testing/Gondwana.Tooling.SceneViewer.WinForms.Tests/Gondwana.Tooling.SceneViewer.WinForms.Tests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Studio WinForms composition tests
        if: ${{ steps.select.outputs.studio == 'true' }}
        run: dotnet test Testing/Gondwana.Tooling.Studio.WinForms.Tests/Gondwana.Tooling.Studio.WinForms.Tests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Tooling importer tests
        if: ${{ steps.select.outputs.importers == 'true' }}
        run: dotnet test Testing/Gondwana.Tooling.Importers.Tests/Gondwana.Tooling.Importers.Tests.csproj --configuration Release --no-build --no-restore --nologo

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore workloads
        run: dotnet workload restore Gondwana.sln /p:EnableWindowsTargeting=true
      - name: Restore
        # /p:Configuration=Release is required so NuGet resolves RID-specific assets
        # required by projects whose Release configuration sets a RuntimeIdentifier,
        # preventing NETSDK1047 errors in the subsequent --no-restore build.
        run: dotnet restore --nologo /p:Configuration=Release /p:EnableWindowsTargeting=true

      - name: Verify formatting
        run: dotnet format whitespace Gondwana.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Verify dead-code and using cleanup
        run: dotnet format style Gondwana.sln --verify-no-changes --no-restore --severity warn --diagnostics IDE0005 IDE0059 IDE0051 --verbosity minimal

      - name: Build
        run: dotnet build --configuration Release --no-restore --nologo /p:EnableWindowsTargeting=true

      - name: Gondwana.Tests unit tests
        run: dotnet test --configuration Release --no-build --no-restore --nologo /p:EnableWindowsTargeting=true Testing/Gondwana.Tests/Gondwana.Tests.csproj

      - name: Setup Node for browser presentation tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Browser helper tests
        run: node --test Testing/BlazorPresentationTests.mjs Testing/browser-audio.test.mjs

