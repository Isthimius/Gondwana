name: One-time API history rebuild

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type REBUILD_GH_PAGES to replace gh-pages after all checks'
        required: true
        type: string
      backup_ref:
        description: 'Optional unique recovery ref: refs/heads/gh-pages-pre-versioning-YYYYMMDD[-suffix]'
        required: false
        type: string

concurrency:
  group: api-docs-publication
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.ref == 'refs/heads/master' && inputs.confirmation == 'REBUILD_GH_PAGES'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation and Doxygen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          python3 -m pip install PyYAML
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.55.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/browser/node_modules" >> "$GITHUB_ENV"
      - name: Validate tooling
        run: |
          python3 -m unittest discover -s Tooling/scripts/api-docs -p 'test_*.py' -v
          node --check docs/doxy/api-versions.js
          node --check Tooling/scripts/api-docs/test-site.cjs
          node Tooling/scripts/api-docs/test-selector.cjs
          bash -n Tooling/scripts/api-docs/publish.sh
          python3 -c "import pathlib,yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]"
      - name: Record original ref, audit legacy files, validate tags, and verify backup
        env:
          BACKUP_REF: ${{ inputs.backup_ref }}
        run: python3 Tooling/scripts/api-docs/rebuild.py prepare --require-master --state "$RUNNER_TEMP/state.json" --backup-ref "$BACKUP_REF"
      - name: Verify branch-based Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json"
          python3 -c "import json,os; p=json.load(open(os.environ['RUNNER_TEMP']+'/pages.json')); assert p['build_type']=='legacy' and p['source']=={'branch':'gh-pages','path':'/'}, 'Expected Pages from gh-pages root; inspect settings before migration'"
      - name: Build all historical tags, then current master
        run: python3 Tooling/scripts/api-docs/rebuild.py build --state "$RUNNER_TEMP/state.json" --destination "$RUNNER_TEMP/archive"
      - name: Browser validation of complete staged site under /Gondwana/
        run: node Tooling/scripts/api-docs/test-site.cjs "$RUNNER_TEMP/archive/site"
      - name: Measure and revalidate before publication
        run: |
          python3 Tooling/scripts/api-docs/rebuild.py validate --state "$RUNNER_TEMP/state.json" --destination "$RUNNER_TEMP/archive"
          cat "$RUNNER_TEMP/archive/report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Atomic replacement with original-SHA lease
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          python3 Tooling/scripts/api-docs/rebuild.py publish --state "$RUNNER_TEMP/state.json" --destination "$RUNNER_TEMP/archive" --confirmation "$CONFIRMATION"
      # GITHUB_TOKEN branch pushes do not themselves trigger a Pages build.
      - name: Request Pages build explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify Pages build completes for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(python3 -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/archive/published.json'))['commit'])")
          for attempt in $(seq 1 20); do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > "$RUNNER_TEMP/build.json"
            actual=$(jq -r .commit "$RUNNER_TEMP/build.json")
            status=$(jq -r .status "$RUNNER_TEMP/build.json")
            if [ "$actual" = "$expected" ] && [ "$status" = built ]; then exit 0; fi
            if [ "$actual" = "$expected" ] && [ "$status" = errored ]; then cat "$RUNNER_TEMP/build.json"; exit 1; fi
            sleep 30
          done
          echo 'Pages did not finish within 10 minutes; inspect build logs and retained recovery evidence.'
          exit 1
      - name: Retain recovery evidence and Doxygen logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-history-evidence
          path: |
            ${{ runner.temp }}/state.json
            ${{ runner.temp }}/archive/*.json
            ${{ runner.temp }}/archive/*.log
          retention-days: 90
