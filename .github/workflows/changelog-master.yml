name: Changelog (master)

# Refresh the incoming PR branch before merging so generated CHANGELOG files do
# not become recurring conflict points. If master advances while PRs are open,
# eligible same-repository PR branches are refreshed automatically.
#
# Only CHANGELOG.md merge conflicts are auto-resolved, always taking master's
# current copy before regenerating the changelogs. Any other merge conflict is
# left for manual resolution.
on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-changelog-script:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set pull request changelog context
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $commits = @(git rev-list "$env:PR_BASE_SHA..$env:PR_HEAD_SHA")
          if ($LASTEXITCODE -ne 0) {
              throw "Could not enumerate commits in the pull request."
          }
          if ($commits.Count -eq 0) {
              throw "The pull request contains no commits to associate with changelog entries."
          }

          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "CHANGELOG_PR_NUMBER=$env:PR_NUMBER"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "CHANGELOG_PR_COMMITS=|$($commits -join '|')|"

      - name: Install git-cliff
        uses: taiki-e/install-action@d8ae1fa96886bc82c05515b8ac15b41515da2c6d # git-cliff

      - name: Validate pull request link rendering
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $range = "$env:PR_BASE_SHA..$env:PR_HEAD_SHA"
          $preview = @(& git-cliff --config cliff.toml --repository . --strip header $range)
          if ($LASTEXITCODE -ne 0) {
              throw "git-cliff failed while validating pull request link rendering."
          }

          $content = $preview -join "`n"
          $expectedLink = "([#$env:CHANGELOG_PR_NUMBER](https://github.com/Isthimius/Gondwana/pull/$env:CHANGELOG_PR_NUMBER))"
          if ($content -match '(?m)^- ' -and $content -notmatch [regex]::Escape($expectedLink)) {
              Write-Host "Generated pull request preview:"
              Write-Host $content
              throw "Current pull request link was not rendered in the changelog preview."
          }

          $escapedLink = [regex]::Escape($expectedLink)
          if ($content -match "(?m)^- .*${escapedLink}.*${escapedLink}") {
              throw "Current pull request link was rendered more than once on a changelog entry."
          }

      - name: Preview changelogs
        shell: pwsh
        run: |
          $before = @(git status --porcelain --untracked-files=all)
          ./Tooling/scripts/Generate-Root-Changelog.ps1 -PreviewOnly
          ./Tooling/scripts/Generate-Project-Changelogs.ps1 -PreviewOnly
          $after = @(git status --porcelain --untracked-files=all)

          if (@(Compare-Object -ReferenceObject $before -DifferenceObject $after).Count -gt 0) {
              throw "PreviewOnly modified the working tree."
          }

      - name: Validate configuration matrix and history preservation
        shell: pwsh
        run: ./Tooling/scripts/Test-ChangelogConfiguration.ps1

  update-changelogs:
    needs: validate-changelog-script
    # Forks do not receive a write token. Never use pull_request_target to run
    # generators from an untrusted PR checkout with repository credentials.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: changelog-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Require token that triggers checks on the generated commit
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.CHANGELOG_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Set CHANGELOG_PUSH_TOKEN to an App token or fine-grained PAT with Contents read/write access to this repository. The default GITHUB_TOKEN does not trigger CI on bot pushes."
            exit 1
          fi

      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current master into pull request branch
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          echo "ORIGINAL_HEAD_SHA=$PR_HEAD_SHA" >> "$GITHUB_ENV"

          git fetch origin master

          set +e
          git merge --no-edit origin/master
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "::error::Merge failed, but Git reported no conflicted files."
              git merge --abort || true
              exit 1
            fi

            non_changelog_conflicts=()
            for file in "${conflicts[@]}"; do
              if [[ "$file" =~ (^|/)CHANGELOG\.md$ ]]; then
                echo "Resolving generated changelog conflict from master: $file"
                git checkout --theirs -- "$file"
                git add -- "$file"
              else
                non_changelog_conflicts+=("$file")
              fi
            done

            if [ "${#non_changelog_conflicts[@]}" -gt 0 ]; then
              echo "::error::Merge has non-CHANGELOG conflicts; manual resolution is required."
              printf '  %s\n' "${non_changelog_conflicts[@]}"
              git merge --abort || true
              exit 1
            fi

            git commit --no-edit
          fi

      - name: Set pull request changelog context
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $commits = @(git rev-list "$env:PR_BASE_SHA..$env:PR_HEAD_SHA")
          if ($LASTEXITCODE -ne 0) {
              throw "Could not enumerate commits in the pull request."
          }
          if ($commits.Count -eq 0) {
              throw "The pull request contains no commits to associate with changelog entries."
          }

          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "CHANGELOG_PR_NUMBER=$env:PR_NUMBER"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "CHANGELOG_PR_COMMITS=|$($commits -join '|')|"

      - name: Install git-cliff
        uses: taiki-e/install-action@d8ae1fa96886bc82c05515b8ac15b41515da2c6d # git-cliff

      - name: Refresh changelogs
        shell: pwsh
        run: |
          ./Tooling/scripts/Generate-Root-Changelog.ps1
          ./Tooling/scripts/Generate-Project-Changelogs.ps1

      - name: Commit and push pull request refresh
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PUSH_TOKEN: ${{ secrets.CHANGELOG_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          # Stage only changelogs, including any bootstrapped project files.
          # Enumerate existing files so root-only repositories need no glob match.
          find . -name .git -prune -o -type f -name CHANGELOG.md -print0 | xargs -0 -r git add --

          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Generator changed files other than CHANGELOG.md files."
            exit 1
          fi

          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: update unreleased changelogs [skip release notes]'
          fi

          if [ "$(git rev-parse HEAD)" = "$ORIGINAL_HEAD_SHA" ]; then
            echo "Pull request branch and changelogs are already current."
            exit 0
          fi

          # A normal push rejects concurrent changes instead of overwriting them.
          # Generated changelog commits are excluded by cliff.toml, so the
          # synchronize run caused by this push should settle to a no-op.
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$HEAD_BRANCH"

  prepare-open-pr-refreshes-after-master-update:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: changelog-master-open-pr-refresh-prepare
      cancel-in-progress: true

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        uses: taiki-e/install-action@d8ae1fa96886bc82c05515b8ac15b41515da2c6d # git-cliff

      - name: Prepare eligible open pull request refreshes
        shell: bash
        env:
          # This job intentionally has no write-capable repository token.
          # PR-controlled generator scripts may execute here, so keep the
          # environment read-only and pass only data to the trusted push job.
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/changelog-refresh-candidates
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -rf "$CANDIDATE_DIR"
          mkdir -p "$CANDIDATE_DIR"
          manifest="$CANDIDATE_DIR/manifest.tsv"
          : > "$manifest"

          # Always work from the latest master in case another master push landed
          # while this workflow was being queued.
          git fetch origin master
          base_sha="$(git rev-parse origin/master)"

          if ! pr_rows="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=master&per_page=100" \
              --jq '.[] | [.number, .head.ref, .head.sha, .head.repo.full_name, (.draft | tostring), .user.login] | @tsv'
          )"; then
            echo "::error::Could not enumerate open pull requests targeting master."
            exit 1
          fi

          prs=()
          if [ -n "$pr_rows" ]; then
            mapfile -t prs < <(printf '%s\n' "$pr_rows")
          fi

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No open pull requests target master."
            exit 0
          fi

          for pr in "${prs[@]}"; do
            IFS=$'\t' read -r pr_number head_branch api_head_sha head_repo is_draft author <<< "$pr"

            if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "Skipping PR #$pr_number: fork pull request."
              continue
            fi

            if [ "$is_draft" = "true" ]; then
              echo "Skipping PR #$pr_number: draft."
              continue
            fi

            if [ "$author" = "dependabot[bot]" ]; then
              echo "Skipping PR #$pr_number: Dependabot."
              continue
            fi

            echo "::group::Prepare PR #$pr_number ($head_branch)"

            # Fetch the branch immediately before working on it so a stale API
            # head SHA does not cause us to prepare an obsolete candidate.
            git fetch origin "+refs/heads/$head_branch:refs/remotes/origin/changelog-pr-$pr_number"
            head_sha="$(git rev-parse "refs/remotes/origin/changelog-pr-$pr_number")"

            if [ "$head_sha" != "$api_head_sha" ]; then
              echo "PR #$pr_number moved after it was listed; using current head $head_sha."
            fi

            git checkout --detach "$head_sha"
            git reset --hard "$head_sha"
            git clean -fd

            mapfile -t pr_commits < <(git rev-list "$base_sha..$head_sha")
            if [ "${#pr_commits[@]}" -eq 0 ]; then
              echo "PR #$pr_number has no commits ahead of current master; skipping."
              echo "::endgroup::"
              continue
            fi

            export CHANGELOG_PR_NUMBER="$pr_number"
            CHANGELOG_PR_COMMITS="|"
            for commit in "${pr_commits[@]}"; do
              CHANGELOG_PR_COMMITS+="${commit}|"
            done
            export CHANGELOG_PR_COMMITS

            set +e
            git merge --no-edit "$base_sha"
            merge_status=$?
            set -e

            if [ "$merge_status" -ne 0 ]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

              if [ "${#conflicts[@]}" -eq 0 ]; then
                echo "::warning::PR #$pr_number could not be merged with master, and Git reported no conflicted files. Leaving it unchanged."
                git merge --abort || true
                echo "::endgroup::"
                continue
              fi

              non_changelog_conflicts=()
              for file in "${conflicts[@]}"; do
                if [[ "$file" =~ (^|/)CHANGELOG\.md$ ]]; then
                  echo "Resolving generated changelog conflict from master: $file"
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                else
                  non_changelog_conflicts+=("$file")
                fi
              done

              if [ "${#non_changelog_conflicts[@]}" -gt 0 ]; then
                echo "::warning::PR #$pr_number has non-CHANGELOG conflicts and requires manual resolution:"
                printf '  %s\n' "${non_changelog_conflicts[@]}"
                git merge --abort || true
                echo "::endgroup::"
                continue
              fi

              git commit --no-edit
            fi

            merged_head_sha="$(git rev-parse HEAD)"

            pwsh -NoLogo -NoProfile -File ./Tooling/scripts/Generate-Root-Changelog.ps1
            pwsh -NoLogo -NoProfile -File ./Tooling/scripts/Generate-Project-Changelogs.ps1

            # Stage only generated changelogs. If a generator touches anything
            # else, stop rather than carrying unrelated changes into the trusted
            # push job.
            find . -name .git -prune -o -type f -name CHANGELOG.md -print0 | xargs -0 -r git add --

            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              echo "::error::Generator changed files other than CHANGELOG.md files while preparing PR #$pr_number."
              exit 1
            fi

            patch_file="$CANDIDATE_DIR/pr-$pr_number.patch"
            git diff --cached --binary > "$patch_file"

            if [ "$merged_head_sha" = "$head_sha" ] && [ ! -s "$patch_file" ]; then
              echo "PR #$pr_number is already current."
              rm -f "$patch_file"
              echo "::endgroup::"
              continue
            fi

            # Record only immutable identifiers and the expected branch name.
            # The trusted push job re-validates every field against GitHub before
            # using the prepared patch.
            printf '%s\t%s\t%s\t%s\n' \
              "$pr_number" "$head_branch" "$head_sha" "$base_sha" >> "$manifest"

            echo "Prepared refresh candidate for PR #$pr_number."
            echo "::endgroup::"
          done

      - name: Upload prepared refreshes
        uses: actions/upload-artifact@v4
        with:
          name: changelog-refresh-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/changelog-refresh-candidates
          if-no-files-found: error
          retention-days: 1

  push-open-pr-refreshes-after-master-update:
    needs: prepare-open-pr-refreshes-after-master-update
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: changelog-master-open-pr-refresh-push
      cancel-in-progress: true

    steps:
      - name: Require token that triggers checks on refreshed pull requests
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.CHANGELOG_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Set CHANGELOG_PUSH_TOKEN to an App token or fine-grained PAT with Contents read/write access to this repository."
            exit 1
          fi

      # Use a fresh runner and a trusted checkout. No PR-controlled script is
      # executed in this job while CHANGELOG_PUSH_TOKEN is available.
      - name: Checkout trusted master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Download prepared refreshes
        uses: actions/download-artifact@v4
        with:
          name: changelog-refresh-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/changelog-refresh-candidates

      - name: Validate and push prepared refreshes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.CHANGELOG_PUSH_TOKEN }}
          CANDIDATE_DIR: ${{ runner.temp }}/changelog-refresh-candidates
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          manifest="$CANDIDATE_DIR/manifest.tsv"
          if [ ! -f "$manifest" ]; then
            echo "::error::Prepared refresh manifest is missing."
            exit 1
          fi

          if [ ! -s "$manifest" ]; then
            echo "No pull request refreshes need to be pushed."
            exit 0
          fi

          git fetch origin master
          current_base_sha="$(git rev-parse origin/master)"

          while IFS=$'\t' read -r pr_number head_branch head_sha base_sha; do
            if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
              echo "::error::Prepared refresh contains an invalid pull request number."
              exit 1
            fi

            echo "::group::Push PR #$pr_number ($head_branch)"

            if ! pr_info="$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/$pr_number" \
                --jq '[.state, .base.ref, .head.ref, .head.sha, .head.repo.full_name, (.draft | tostring), .user.login] | @tsv'
            )"; then
              echo "::error::Could not re-read PR #$pr_number before pushing."
              exit 1
            fi

            IFS=$'\t' read -r state api_base_ref api_head_branch api_head_sha head_repo is_draft author <<< "$pr_info"

            if [ "$state" != "open" ] || [ "$api_base_ref" != "master" ]; then
              echo "PR #$pr_number is no longer an open PR targeting master; skipping."
              echo "::endgroup::"
              continue
            fi

            if [ "$head_repo" != "$GITHUB_REPOSITORY" ] || [ "$api_head_branch" != "$head_branch" ]; then
              echo "::warning::PR #$pr_number repository or branch no longer matches the prepared candidate; skipping."
              echo "::endgroup::"
              continue
            fi

            if [ "$is_draft" = "true" ] || [ "$author" = "dependabot[bot]" ]; then
              echo "PR #$pr_number is no longer eligible for automatic refresh; skipping."
              echo "::endgroup::"
              continue
            fi

            if [ "$api_head_sha" != "$head_sha" ]; then
              echo "::warning::PR #$pr_number moved from $head_sha to $api_head_sha after preparation; leaving the newer branch untouched."
              echo "::endgroup::"
              continue
            fi

            if [ "$current_base_sha" != "$base_sha" ]; then
              echo "::warning::Master moved from $base_sha to $current_base_sha after preparation; skipping PR #$pr_number. A newer master workflow run will refresh it."
              echo "::endgroup::"
              continue
            fi

            git fetch origin "+refs/heads/$head_branch:refs/remotes/origin/changelog-push-$pr_number"
            actual_head_sha="$(git rev-parse "refs/remotes/origin/changelog-push-$pr_number")"
            if [ "$actual_head_sha" != "$head_sha" ]; then
              echo "::warning::PR #$pr_number moved while being validated; skipping."
              echo "::endgroup::"
              continue
            fi

            git checkout --detach "$head_sha"
            git reset --hard "$head_sha"
            git clean -fd

            set +e
            git merge --no-edit "$base_sha"
            merge_status=$?
            set -e

            if [ "$merge_status" -ne 0 ]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

              if [ "${#conflicts[@]}" -eq 0 ]; then
                echo "::warning::PR #$pr_number could not be merged during trusted replay; skipping."
                git merge --abort || true
                echo "::endgroup::"
                continue
              fi

              non_changelog_conflicts=()
              for file in "${conflicts[@]}"; do
                if [[ "$file" =~ (^|/)CHANGELOG\.md$ ]]; then
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                else
                  non_changelog_conflicts+=("$file")
                fi
              done

              if [ "${#non_changelog_conflicts[@]}" -gt 0 ]; then
                echo "::warning::PR #$pr_number developed non-CHANGELOG conflicts during trusted replay; skipping."
                git merge --abort || true
                echo "::endgroup::"
                continue
              fi

              git commit --no-edit
            fi

            patch_file="$CANDIDATE_DIR/pr-$pr_number.patch"
            if [ -s "$patch_file" ]; then
              if ! git apply --check "$patch_file"; then
                echo "::error::Prepared CHANGELOG patch for PR #$pr_number no longer applies cleanly."
                exit 1
              fi

              git apply "$patch_file"

              # Stage only CHANGELOG files, then verify the prepared data did not
              # alter anything else before the write-capable push is attempted.
              find . -name .git -prune -o -type f -name CHANGELOG.md -print0 | xargs -0 -r git add --

              if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
                echo "::error::Prepared data for PR #$pr_number changed files other than CHANGELOG.md files."
                exit 1
              fi

              while IFS= read -r staged_file; do
                if [[ ! "$staged_file" =~ (^|/)CHANGELOG\.md$ ]]; then
                  echo "::error::Prepared data attempted to stage a non-CHANGELOG file: $staged_file"
                  exit 1
                fi
              done < <(git diff --cached --name-only)

              if ! git diff --cached --quiet; then
                git commit -m 'docs: update unreleased changelogs [skip release notes]'
              fi
            fi

            if [ "$(git rev-parse HEAD)" = "$head_sha" ]; then
              echo "PR #$pr_number became current without a push."
              echo "::endgroup::"
              continue
            fi

            # Never force-push. If the branch moved while this job was running,
            # treat the non-fast-forward rejection as a per-PR race and continue.
            set +e
            push_output="$(
              git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                "HEAD:refs/heads/$head_branch" 2>&1
            )"
            push_status=$?
            set -e

            if [ "$push_status" -ne 0 ]; then
              printf '%s\n' "$push_output"

              set +e
              remote_line="$(git ls-remote origin "refs/heads/$head_branch" 2>&1)"
              remote_status=$?
              set -e

              if [ "$remote_status" -ne 0 ]; then
                echo "::error::Push for PR #$pr_number failed, and the branch state could not be re-read."
                printf '%s\n' "$remote_line"
                exit "$push_status"
              fi

              current_remote_sha="$(printf '%s\n' "$remote_line" | awk 'NR == 1 { print $1 }')"

              if [ -z "$current_remote_sha" ]; then
                echo "::warning::PR #$pr_number branch no longer exists; skipping it."
                echo "::endgroup::"
                continue
              fi

              if [ "$current_remote_sha" != "$head_sha" ]; then
                echo "::warning::PR #$pr_number moved from $head_sha to $current_remote_sha while being refreshed; leaving the newer branch untouched."
                echo "::endgroup::"
                continue
              fi

              echo "::error::Push for PR #$pr_number failed even though the remote branch did not move."
              exit "$push_status"
            fi

            echo "::endgroup::"
          done < "$manifest"