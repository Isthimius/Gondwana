name: Changelog (master)

# Refresh the incoming PR branch before merging so generated CHANGELOG files do
# not become recurring conflict points. If master advances while PRs are open,
# eligible same-repository PR branches are refreshed automatically.
#
# Only CHANGELOG.md merge conflicts are auto-resolved, always taking master's
# current copy before regenerating the changelogs. Any other merge conflict is
# left for manual resolution.
on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-changelog-script:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set pull request changelog context
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $commits = @(git rev-list "$env:PR_BASE_SHA..$env:PR_HEAD_SHA")
          if ($LASTEXITCODE -ne 0) {
              throw "Could not enumerate commits in the pull request."
          }
          if ($commits.Count -eq 0) {
              throw "The pull request contains no commits to associate with changelog entries."
          }

          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "CHANGELOG_PR_NUMBER=$env:PR_NUMBER"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "CHANGELOG_PR_COMMITS=|$($commits -join '|')|"

      - name: Install git-cliff
        uses: taiki-e/install-action@d8ae1fa96886bc82c05515b8ac15b41515da2c6d # git-cliff

      - name: Validate pull request link rendering
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $range = "$env:PR_BASE_SHA..$env:PR_HEAD_SHA"
          $preview = @(& git-cliff --config cliff.toml --repository . --strip header $range)
          if ($LASTEXITCODE -ne 0) {
              throw "git-cliff failed while validating pull request link rendering."
          }

          $content = $preview -join "`n"
          $expectedLink = "([#$env:CHANGELOG_PR_NUMBER](https://github.com/Isthimius/Gondwana/pull/$env:CHANGELOG_PR_NUMBER))"
          if ($content -match '(?m)^- ' -and $content -notmatch [regex]::Escape($expectedLink)) {
              Write-Host "Generated pull request preview:"
              Write-Host $content
              throw "Current pull request link was not rendered in the changelog preview."
          }

          $escapedLink = [regex]::Escape($expectedLink)
          if ($content -match "(?m)^- .*${escapedLink}.*${escapedLink}") {
              throw "Current pull request link was rendered more than once on a changelog entry."
          }

      - name: Preview changelogs
        shell: pwsh
        run: |
          $before = @(git status --porcelain --untracked-files=all)
          ./Tooling/scripts/Generate-Root-Changelog.ps1 -PreviewOnly
          ./Tooling/scripts/Generate-Project-Changelogs.ps1 -PreviewOnly
          $after = @(git status --porcelain --untracked-files=all)

          if (@(Compare-Object -ReferenceObject $before -DifferenceObject $after).Count -gt 0) {
              throw "PreviewOnly modified the working tree."
          }

      - name: Validate configuration matrix and history preservation
        shell: pwsh
        run: ./Tooling/scripts/Test-ChangelogConfiguration.ps1

  update-changelogs:
    needs: validate-changelog-script
    # Forks do not receive a write token. Never use pull_request_target to run
    # generators from an untrusted PR checkout with repository credentials.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: changelog-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Require token that triggers checks on the generated commit
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.CHANGELOG_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Set CHANGELOG_PUSH_TOKEN to an App token or fine-grained PAT with Contents read/write access to this repository. The default GITHUB_TOKEN does not trigger CI on bot pushes."
            exit 1
          fi

      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current master into pull request branch
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          echo "ORIGINAL_HEAD_SHA=$PR_HEAD_SHA" >> "$GITHUB_ENV"

          git fetch origin master

          set +e
          git merge --no-edit origin/master
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "::error::Merge failed, but Git reported no conflicted files."
              git merge --abort || true
              exit 1
            fi

            non_changelog_conflicts=()
            for file in "${conflicts[@]}"; do
              if [[ "$file" =~ (^|/)CHANGELOG\.md$ ]]; then
                echo "Resolving generated changelog conflict from master: $file"
                git checkout --theirs -- "$file"
                git add -- "$file"
              else
                non_changelog_conflicts+=("$file")
              fi
            done

            if [ "${#non_changelog_conflicts[@]}" -gt 0 ]; then
              echo "::error::Merge has non-CHANGELOG conflicts; manual resolution is required."
              printf '  %s\n' "${non_changelog_conflicts[@]}"
              git merge --abort || true
              exit 1
            fi

            git commit --no-edit
          fi

      - name: Set pull request changelog context
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $commits = @(git rev-list "$env:PR_BASE_SHA..$env:PR_HEAD_SHA")
          if ($LASTEXITCODE -ne 0) {
              throw "Could not enumerate commits in the pull request."
          }
          if ($commits.Count -eq 0) {
              throw "The pull request contains no commits to associate with changelog entries."
          }

          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "CHANGELOG_PR_NUMBER=$env:PR_NUMBER"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "CHANGELOG_PR_COMMITS=|$($commits -join '|')|"

      - name: Install git-cliff
        uses: taiki-e/install-action@d8ae1fa96886bc82c05515b8ac15b41515da2c6d # git-cliff

      - name: Refresh changelogs
        shell: pwsh
        run: |
          ./Tooling/scripts/Generate-Root-Changelog.ps1
          ./Tooling/scripts/Generate-Project-Changelogs.ps1

      - name: Commit and push pull request refresh
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PUSH_TOKEN: ${{ secrets.CHANGELOG_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          # Stage only changelogs, including any bootstrapped project files.
          # Enumerate existing files so root-only repositories need no glob match.
          find . -name .git -prune -o -type f -name CHANGELOG.md -print0 | xargs -0 -r git add --

          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Generator changed files other than CHANGELOG.md files."
            exit 1
          fi

          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: update unreleased changelogs [skip release notes]'
          fi

          if [ "$(git rev-parse HEAD)" = "$ORIGINAL_HEAD_SHA" ]; then
            echo "Pull request branch and changelogs are already current."
            exit 0
          fi

          # Require the remote branch to still exist at the exact PR head this
          # run started from. This rejects concurrent updates and branch deletion
          # instead of recreating or overwriting the branch.
          git push \
            --force-with-lease="refs/heads/$HEAD_BRANCH:$ORIGINAL_HEAD_SHA" \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/$HEAD_BRANCH"

  discover_open_pr_refreshes_after_master_update:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: changelog-master-open-pr-refresh-discovery
      cancel-in-progress: true
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
      base_sha: ${{ steps.discover.outputs.base_sha }}

    steps:
      - name: Checkout trusted master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Discover eligible open pull requests
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin master
          base_sha="$(git rev-parse origin/master)"

          if ! pr_rows="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=master&per_page=100" \
              --jq '.[] | [.number, .head.sha, .head.repo.full_name, (.draft | tostring), .user.login] | @tsv'
          )"; then
            echo "::error::Could not enumerate open pull requests targeting master."
            exit 1
          fi

          candidates='[]'
          count=0

          if [ -n "$pr_rows" ]; then
            while IFS=$'\t' read -r pr_number head_sha head_repo is_draft author; do
              if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
                continue
              fi

              if [ "$is_draft" = "true" ] || [ "$author" = "dependabot[bot]" ]; then
                continue
              fi

              if [[ ! "$pr_number" =~ ^[0-9]+$ ]] || [[ ! "$head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::GitHub returned invalid pull request metadata."
                exit 1
              fi

              candidates="$(
                jq -c \
                  --arg number "$pr_number" \
                  --arg head_sha "$head_sha" \
                  '. + [{number: ($number | tonumber), head_sha: $head_sha}]' \
                  <<< "$candidates"
              )"
              count=$((count + 1))
            done <<< "$pr_rows"
          fi

          matrix="$(jq -cn --argjson include "$candidates" '{include: $include}')"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          echo "Discovered $count eligible open pull request(s)."

  prepare_open_pr_refresh_after_master_update:
    needs: discover_open_pr_refreshes_after_master_update
    if: >-
      github.event_name == 'push' &&
      needs.discover_open_pr_refreshes_after_master_update.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover_open_pr_refreshes_after_master_update.outputs.matrix) }}
    concurrency:
      group: changelog-master-prepare-pr-${{ matrix.number }}
      cancel-in-progress: true

    steps:
      # Each matrix job handles exactly one PR on its own runner. The artifact
      # identity is derived from trusted discovery output, not from files that
      # PR-controlled generator scripts can modify.
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover_open_pr_refreshes_after_master_update.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        uses: taiki-e/install-action@d8ae1fa96886bc82c05515b8ac15b41515da2c6d # git-cliff

      - name: Prepare pull request refresh
        shell: bash
        env:
          # This job intentionally has no write-capable repository token.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.number }}
          EXPECTED_HEAD_SHA: ${{ matrix.head_sha }}
          BASE_SHA: ${{ needs.discover_open_pr_refreshes_after_master_update.outputs.base_sha }}
          CANDIDATE_PATCH: ${{ runner.temp }}/candidate.patch
        run: |
          set -euo pipefail

          # Always leave a candidate artifact behind. If the PR becomes
          # ineligible or develops a non-CHANGELOG conflict, the trusted replay
          # job will independently re-check that state and skip it.
          : > "$CANDIDATE_PATCH"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! pr_info="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER" \
              --jq '[.state, .base.ref, .head.ref, .head.sha, .head.repo.full_name, (.draft | tostring), .user.login] | @tsv'
          )"; then
            echo "::error::Could not read PR #$PR_NUMBER while preparing its refresh."
            exit 1
          fi

          IFS=$'\t' read -r state api_base_ref head_branch api_head_sha head_repo is_draft author <<< "$pr_info"

          if [ "$state" != "open" ] || [ "$api_base_ref" != "master" ]; then
            echo "PR #$PR_NUMBER is no longer an open PR targeting master; skipping preparation."
            exit 0
          fi

          if [ "$head_repo" != "$GITHUB_REPOSITORY" ] || [ "$api_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "PR #$PR_NUMBER moved or no longer belongs to this repository; skipping preparation."
            exit 0
          fi

          if [ "$is_draft" = "true" ] || [ "$author" = "dependabot[bot]" ]; then
            echo "PR #$PR_NUMBER is no longer eligible for automatic refresh; skipping preparation."
            exit 0
          fi

          git fetch origin master
          current_base_sha="$(git rev-parse origin/master)"
          if [ "$current_base_sha" != "$BASE_SHA" ]; then
            echo "Master moved after discovery; a newer workflow run will prepare PR #$PR_NUMBER."
            exit 0
          fi

          git fetch origin "+refs/heads/$head_branch:refs/remotes/origin/changelog-pr-$PR_NUMBER"
          actual_head_sha="$(git rev-parse "refs/remotes/origin/changelog-pr-$PR_NUMBER")"
          if [ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "PR #$PR_NUMBER moved while being prepared; skipping."
            exit 0
          fi

          git checkout --detach "$EXPECTED_HEAD_SHA"
          git reset --hard "$EXPECTED_HEAD_SHA"
          git clean -fd

          mapfile -t pr_commits < <(git rev-list "$BASE_SHA..$EXPECTED_HEAD_SHA")
          if [ "${#pr_commits[@]}" -eq 0 ]; then
            echo "PR #$PR_NUMBER has no commits ahead of the discovered master; nothing to prepare."
            exit 0
          fi

          export CHANGELOG_PR_NUMBER="$PR_NUMBER"
          CHANGELOG_PR_COMMITS="|"
          for commit in "${pr_commits[@]}"; do
            CHANGELOG_PR_COMMITS+="${commit}|"
          done
          export CHANGELOG_PR_COMMITS

          set +e
          git merge --no-edit "$BASE_SHA"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "::warning::PR #$PR_NUMBER could not be merged with master, and Git reported no conflicted files."
              git merge --abort || true
              exit 0
            fi

            non_changelog_conflicts=()
            for file in "${conflicts[@]}"; do
              if [[ "$file" =~ (^|/)CHANGELOG\.md$ ]]; then
                echo "Resolving generated changelog conflict from master: $file"
                git checkout --theirs -- "$file"
                git add -- "$file"
              else
                non_changelog_conflicts+=("$file")
              fi
            done

            if [ "${#non_changelog_conflicts[@]}" -gt 0 ]; then
              echo "::warning::PR #$PR_NUMBER has non-CHANGELOG conflicts and requires manual resolution:"
              printf '  %s\n' "${non_changelog_conflicts[@]}"
              git merge --abort || true
              exit 0
            fi

            git commit --no-edit
          fi

          # These scripts are PR-controlled at this point, but this runner has no
          # write-capable repository secret and can only produce this PR's fixed
          # candidate artifact.
          pwsh -NoLogo -NoProfile -File ./Tooling/scripts/Generate-Root-Changelog.ps1
          pwsh -NoLogo -NoProfile -File ./Tooling/scripts/Generate-Project-Changelogs.ps1

          find . -name .git -prune -o -type f -name CHANGELOG.md -print0 | xargs -0 -r git add --

          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Generator changed files other than CHANGELOG.md files while preparing PR #$PR_NUMBER."
            exit 1
          fi

          git diff --cached --binary > "$CANDIDATE_PATCH"

      - name: Upload pull request refresh candidate
        uses: actions/upload-artifact@v4
        with:
          # The name is bound to trusted matrix metadata. PR-controlled code can
          # alter only the contents of its own candidate, never another PR's.
          name: changelog-refresh-pr-${{ matrix.number }}-${{ matrix.head_sha }}-${{ needs.discover_open_pr_refreshes_after_master_update.outputs.base_sha }}
          path: ${{ runner.temp }}/candidate.patch
          if-no-files-found: error
          retention-days: 1

  push_open_pr_refresh_after_master_update:
    needs:
      - discover_open_pr_refreshes_after_master_update
      - prepare_open_pr_refresh_after_master_update
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.discover_open_pr_refreshes_after_master_update.result == 'success' &&
      needs.discover_open_pr_refreshes_after_master_update.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover_open_pr_refreshes_after_master_update.outputs.matrix) }}
    concurrency:
      group: changelog-master-push-pr-${{ matrix.number }}
      cancel-in-progress: true

    steps:
      - name: Require token that triggers checks on refreshed pull requests
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.CHANGELOG_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Set CHANGELOG_PUSH_TOKEN to an App token or fine-grained PAT with Contents read/write access to this repository."
            exit 1
          fi

      # Fresh runner, trusted checkout, and no execution of PR-controlled code.
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover_open_pr_refreshes_after_master_update.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download this pull request's prepared candidate
        uses: actions/download-artifact@v4
        with:
          name: changelog-refresh-pr-${{ matrix.number }}-${{ matrix.head_sha }}-${{ needs.discover_open_pr_refreshes_after_master_update.outputs.base_sha }}
          path: ${{ runner.temp }}/changelog-refresh-candidate

      - name: Validate and push prepared refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.CHANGELOG_PUSH_TOKEN }}
          PR_NUMBER: ${{ matrix.number }}
          EXPECTED_HEAD_SHA: ${{ matrix.head_sha }}
          BASE_SHA: ${{ needs.discover_open_pr_refreshes_after_master_update.outputs.base_sha }}
          CANDIDATE_PATCH: ${{ runner.temp }}/changelog-refresh-candidate/candidate.patch
        run: |
          set -euo pipefail

          if [ ! -f "$CANDIDATE_PATCH" ]; then
            echo "::error::Prepared candidate for PR #$PR_NUMBER is missing."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! pr_info="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER" \
              --jq '[.state, .base.ref, .head.ref, .head.sha, .head.repo.full_name, (.draft | tostring), .user.login] | @tsv'
          )"; then
            echo "::error::Could not re-read PR #$PR_NUMBER before pushing."
            exit 1
          fi

          IFS=$'\t' read -r state api_base_ref head_branch api_head_sha head_repo is_draft author <<< "$pr_info"

          if [ "$state" != "open" ] || [ "$api_base_ref" != "master" ]; then
            echo "PR #$PR_NUMBER is no longer an open PR targeting master; skipping."
            exit 0
          fi

          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "PR #$PR_NUMBER is no longer a same-repository pull request; skipping."
            exit 0
          fi

          if [ "$is_draft" = "true" ] || [ "$author" = "dependabot[bot]" ]; then
            echo "PR #$PR_NUMBER is no longer eligible for automatic refresh; skipping."
            exit 0
          fi

          if [ "$api_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::warning::PR #$PR_NUMBER moved from $EXPECTED_HEAD_SHA to $api_head_sha after preparation; leaving the newer branch untouched."
            exit 0
          fi

          git fetch origin master
          current_base_sha="$(git rev-parse origin/master)"
          if [ "$current_base_sha" != "$BASE_SHA" ]; then
            echo "::warning::Master moved from $BASE_SHA to $current_base_sha after preparation; a newer workflow run will refresh PR #$PR_NUMBER."
            exit 0
          fi

          git fetch origin "+refs/heads/$head_branch:refs/remotes/origin/changelog-push-$PR_NUMBER"
          actual_head_sha="$(git rev-parse "refs/remotes/origin/changelog-push-$PR_NUMBER")"
          if [ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::warning::PR #$PR_NUMBER moved while being validated; skipping."
            exit 0
          fi

          git checkout --detach "$EXPECTED_HEAD_SHA"
          git reset --hard "$EXPECTED_HEAD_SHA"
          git clean -fd

          set +e
          git merge --no-edit "$BASE_SHA"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "::warning::PR #$PR_NUMBER could not be merged during trusted replay; skipping."
              git merge --abort || true
              exit 0
            fi

            non_changelog_conflicts=()
            for file in "${conflicts[@]}"; do
              if [[ "$file" =~ (^|/)CHANGELOG\.md$ ]]; then
                git checkout --theirs -- "$file"
                git add -- "$file"
              else
                non_changelog_conflicts+=("$file")
              fi
            done

            if [ "${#non_changelog_conflicts[@]}" -gt 0 ]; then
              echo "::warning::PR #$PR_NUMBER developed non-CHANGELOG conflicts during trusted replay; skipping."
              git merge --abort || true
              exit 0
            fi

            git commit --no-edit
          fi

          if [ -s "$CANDIDATE_PATCH" ]; then
            if ! git apply --check "$CANDIDATE_PATCH"; then
              echo "::error::Prepared CHANGELOG patch for PR #$PR_NUMBER no longer applies cleanly."
              exit 1
            fi

            git apply "$CANDIDATE_PATCH"

            # Stage only CHANGELOG files, then prove the prepared candidate did
            # not alter anything else before exposing the write-capable push.
            find . -name .git -prune -o -type f -name CHANGELOG.md -print0 | xargs -0 -r git add --

            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              echo "::error::Prepared data for PR #$PR_NUMBER changed files other than CHANGELOG.md files."
              exit 1
            fi

            while IFS= read -r staged_file; do
              if [[ ! "$staged_file" =~ (^|/)CHANGELOG\.md$ ]]; then
                echo "::error::Prepared data attempted to stage a non-CHANGELOG file: $staged_file"
                exit 1
              fi
            done < <(git diff --cached --name-only)

            if ! git diff --cached --quiet; then
              git commit -m 'docs: update unreleased changelogs [skip release notes]'
            fi
          fi

          if [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA" ]; then
            echo "PR #$PR_NUMBER is already current."
            exit 0
          fi

          # The explicit expected-old-SHA lease protects both races: if the PR
          # branch moved or was deleted after validation, this push is rejected.
          set +e
          push_output="$(
            git push \
              --force-with-lease="refs/heads/$head_branch:$EXPECTED_HEAD_SHA" \
              "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/$head_branch" 2>&1
          )"
          push_status=$?
          set -e

          if [ "$push_status" -ne 0 ]; then
            printf '%s\n' "$push_output"

            set +e
            remote_line="$(git ls-remote origin "refs/heads/$head_branch" 2>&1)"
            remote_status=$?
            set -e

            if [ "$remote_status" -ne 0 ]; then
              echo "::error::Push for PR #$PR_NUMBER failed, and the branch state could not be re-read."
              printf '%s\n' "$remote_line"
              exit "$push_status"
            fi

            current_remote_sha="$(printf '%s\n' "$remote_line" | awk 'NR == 1 { print $1 }')"

            if [ -z "$current_remote_sha" ]; then
              echo "::warning::PR #$PR_NUMBER branch was deleted while being refreshed; it was not recreated."
              exit 0
            fi

            if [ "$current_remote_sha" != "$EXPECTED_HEAD_SHA" ]; then
              echo "::warning::PR #$PR_NUMBER moved from $EXPECTED_HEAD_SHA to $current_remote_sha while being refreshed; leaving the newer branch untouched."
              exit 0
            fi

            echo "::error::Push for PR #$PR_NUMBER failed even though the remote branch still matches the expected head."
            exit "$push_status"
          fi
