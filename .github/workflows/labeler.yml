name: Label PR

on:
  pull_request_target:
    # Edited also lets previously opened PRs pick up newly added project rules.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  # actions/labeler needs this to create missing project labels on first use.
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          # Preserve existing/manual labels; apply these rules going forward only.
          sync-labels: false
