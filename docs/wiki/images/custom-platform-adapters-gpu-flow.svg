<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Gondwana GPU rendering and presentation flow</title>
<desc id="desc">Gondwana GPU rendering and presentation flow</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
  </filter>
</defs>
<style>
  .bg { fill: #f8fafc; }
  .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
  .core { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
  .platform { fill: #ecfccb; stroke: #65a30d; stroke-width: 2; }
  .custom { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
  .muted { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
  .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
  .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
  .boxTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
  .boxText { font: 400 14px Arial, sans-serif; fill: #334155; }
  .small { font: 400 12px Arial, sans-serif; fill: #475569; }
  .label { font: 700 13px Arial, sans-serif; fill: #475569; letter-spacing: .5px; }
  .arrow { stroke: #475569; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
</style>
<rect class="bg" width="100%" height="100%"/>

<text x="60" y="58" class="title" text-anchor="start">GPU / GL-thread Rendering Path</text>
<text x="60" y="88" class="subtitle" text-anchor="start">The native GL paint callback owns rendering because the GRContext must remain current on one thread.</text>
<rect x="70" y="135" width="1140" height="585" rx="20" class="panel"/>
<text x="100" y="170" class="label" text-anchor="start">FRAME REQUEST</text>
<rect x="110" y="200" width="220" height="90" rx="14" class="custom"/>
<text x="220" y="235" class="boxTitle" text-anchor="middle">Engine.AfterFrameRender</text>
<text x="220" y="260" class="small" text-anchor="middle">request native repaint</text>
<rect x="410" y="200" width="220" height="90" rx="14" class="platform"/>
<text x="520" y="235" class="boxTitle" text-anchor="middle">UI invalidation</text>
<text x="520" y="260" class="small" text-anchor="middle">coalesce queued paints</text>
<rect x="710" y="200" width="390" height="90" rx="14" class="platform"/>
<text x="905" y="235" class="boxTitle" text-anchor="middle">Native GL Paint callback</text>
<text x="905" y="260" class="small" text-anchor="middle">GRContext is current here</text>
<line x1="330" y1="245" x2="400" y2="245" class="arrow"/>
<line x1="630" y1="245" x2="700" y2="245" class="arrow"/>
<text x="100" y="345" class="label" text-anchor="start">GL-THREAD WORK</text>
<rect x="110" y="375" width="220" height="105" rx="14" class="custom"/>
<text x="220" y="410" class="boxTitle" text-anchor="middle">Initialize / Resize</text>
<text x="220" y="438" class="small" text-anchor="middle">GpuBackbuffer.Initialize</text>
<text x="220" y="458" class="small" text-anchor="middle">using current GRContext</text>
<rect x="410" y="375" width="220" height="105" rx="14" class="core"/>
<text x="520" y="410" class="boxTitle" text-anchor="middle">GlRenderAndSnapshot</text>
<text x="520" y="438" class="small" text-anchor="middle">full Gondwana render</text>
<text x="520" y="458" class="small" text-anchor="middle">full-frame GPU path</text>
<rect x="710" y="375" width="220" height="105" rx="14" class="core"/>
<text x="820" y="410" class="boxTitle" text-anchor="middle">GPU-backed SKImage</text>
<text x="820" y="438" class="small" text-anchor="middle">same-frame snapshot</text>
<text x="820" y="458" class="small" text-anchor="middle">dispose in callback</text>
<rect x="1010" y="375" width="150" height="105" rx="14" class="platform"/>
<text x="1085" y="410" class="boxTitle" text-anchor="middle">Present</text>
<text x="1085" y="438" class="small" text-anchor="middle">DrawImage</text>
<text x="1085" y="458" class="small" text-anchor="middle">Flush</text>
<line x1="330" y1="427" x2="400" y2="427" class="arrow"/>
<line x1="630" y1="427" x2="700" y2="427" class="arrow"/>
<line x1="930" y1="427" x2="1000" y2="427" class="arrow"/>
<text x="100" y="555" class="label" text-anchor="start">KEY DIFFERENCES</text>
<rect x="110" y="585" width="1050" height="95" rx="16" class="muted"/>
<text x="145" y="620" class="boxTitle" text-anchor="start">•</text>
<text x="175" y="620" class="boxText" text-anchor="start">No normal dirty-rectangle presentation; GL redraws the full viewport.</text>
<text x="145" y="650" class="boxTitle" text-anchor="start">•</text>
<text x="175" y="650" class="boxText" text-anchor="start">No cross-thread GPU canvas access; initialize, render, snapshot, draw, and flush on the GL thread.</text>
<text x="640" y="775" class="subtitle" text-anchor="middle">The adapter owns the platform paint loop; the host still owns Gondwana scene-render orchestration.</text>
</svg>