<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Gondwana platform adapter and render surface architecture</title>
<desc id="desc">Gondwana platform adapter and render surface architecture</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
  </filter>
</defs>
<style>
  .bg { fill: #f8fafc; }
  .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
  .core { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
  .platform { fill: #ecfccb; stroke: #65a30d; stroke-width: 2; }
  .custom { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
  .muted { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
  .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
  .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
  .boxTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
  .boxText { font: 400 14px Arial, sans-serif; fill: #334155; }
  .small { font: 400 12px Arial, sans-serif; fill: #475569; }
  .label { font: 700 13px Arial, sans-serif; fill: #475569; letter-spacing: .5px; }
  .arrow { stroke: #475569; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
</style>
<rect class="bg" width="100%" height="100%"/>

<text x="60" y="58" class="title" text-anchor="start">Custom Platform Adapters and Render Surfaces</text>
<text x="60" y="88" class="subtitle" text-anchor="start">Engine rendering stays platform-agnostic; native presentation stays at the edge.</text>
<rect x="55" y="125" width="780" height="560" rx="20" class="panel"/>
<text x="82" y="160" class="label" text-anchor="start">GONDWANA CORE</text>
<rect x="95" y="200" width="190" height="100" rx="14" class="core"/>
<text x="190" y="235" class="boxTitle" text-anchor="middle">Scene</text>
<text x="190" y="263" class="boxText" text-anchor="middle">layers · sprites · drawings</text>
<rect x="350" y="200" width="190" height="100" rx="14" class="core"/>
<text x="445" y="235" class="boxTitle" text-anchor="middle">ViewManager</text>
<text x="445" y="263" class="boxText" text-anchor="middle">views · cameras · viewports</text>
<rect x="222" y="355" width="300" height="115" rx="14" class="core"/>
<text x="372" y="390" class="boxTitle" text-anchor="middle">RenderSurfaceHost&lt;TBackbuffer&gt;</text>
<text x="372" y="418" class="boxText" text-anchor="middle">render orchestration · resize</text>
<text x="372" y="442" class="boxText" text-anchor="middle">dirty/full-frame behavior</text>
<rect x="222" y="535" width="300" height="105" rx="14" class="core"/>
<text x="372" y="570" class="boxTitle" text-anchor="middle">BackbufferBase</text>
<text x="372" y="596" class="boxText" text-anchor="middle">SKCanvas · frame lifecycle</text>
<text x="372" y="618" class="boxText" text-anchor="middle">SKImage snapshots</text>
<rect x="880" y="125" width="345" height="560" rx="20" class="panel"/>
<text x="905" y="160" class="label" text-anchor="start">PLATFORM PACKAGE</text>
<rect x="915" y="205" width="275" height="100" rx="14" class="custom"/>
<text x="1052" y="240" class="boxTitle" text-anchor="middle">GameHostBase derivative</text>
<text x="1052" y="266" class="boxText" text-anchor="middle">lifecycle · services · input</text>
<rect x="915" y="365" width="275" height="105" rx="14" class="custom"/>
<text x="1052" y="400" class="boxTitle" text-anchor="middle">RenderSurfaceAdapterBase</text>
<text x="1052" y="426" class="boxText" text-anchor="middle">size · Present(SKImage, …)</text>
<text x="1052" y="448" class="boxText" text-anchor="middle">platform bridge</text>
<rect x="915" y="535" width="275" height="105" rx="14" class="platform"/>
<text x="1052" y="570" class="boxTitle" text-anchor="middle">Native UI surface</text>
<text x="1052" y="596" class="boxText" text-anchor="middle">control · canvas · GL surface</text>
<text x="1052" y="618" class="boxText" text-anchor="middle">native paint callbacks</text>
<line x1="285" y1="250" x2="350" y2="250" class="arrow"/>
<line x1="445" y1="300" x2="404" y2="355" class="arrow"/>
<line x1="190" y1="300" x2="330" y2="355" class="arrow"/>
<line x1="372" y1="470" x2="372" y2="535" class="arrow"/>
<line x1="522" y1="587" x2="915" y2="420" class="arrow"/>
<line x1="1052" y1="470" x2="1052" y2="535" class="arrow"/>
<line x1="1052" y1="305" x2="1052" y2="365" class="dash"/>
<text x="685" y="505" class="small" text-anchor="middle">finished frame</text>
<text x="870" y="344" class="small" text-anchor="end">optional full-platform host</text>
<text x="635" y="715" class="subtitle" text-anchor="middle">Custom code normally begins at the adapter/platform-host side — not by replacing scene rendering.</text>
</svg>