<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Gondwana bitmap rendering and presentation flow</title>
<desc id="desc">Gondwana bitmap rendering and presentation flow</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
  </filter>
</defs>
<style>
  .bg { fill: #f8fafc; }
  .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
  .core { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
  .platform { fill: #ecfccb; stroke: #65a30d; stroke-width: 2; }
  .custom { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
  .muted { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
  .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
  .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
  .boxTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
  .boxText { font: 400 14px Arial, sans-serif; fill: #334155; }
  .small { font: 400 12px Arial, sans-serif; fill: #475569; }
  .label { font: 700 13px Arial, sans-serif; fill: #475569; letter-spacing: .5px; }
  .arrow { stroke: #475569; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
</style>
<rect class="bg" width="100%" height="100%"/>

<text x="60" y="58" class="title" text-anchor="start">Bitmap / CPU Rendering Path</text>
<text x="60" y="88" class="subtitle" text-anchor="start">Dirty-region rendering is produced by the engine, then snapshots are presented on the UI side.</text>
<rect x="80" y="145" width="170" height="105" rx="14" class="core"/>
<text x="165.0" y="180" class="boxTitle" text-anchor="middle">Engine cycle</text>
<text x="165.0" y="207" class="small" text-anchor="middle">foreground render</text>
<rect x="290" y="145" width="170" height="105" rx="14" class="core"/>
<text x="375.0" y="180" class="boxTitle" text-anchor="middle">RenderSurfaceHost</text>
<text x="375.0" y="207" class="small" text-anchor="middle">dirty-region orchestration</text>
<rect x="500" y="145" width="170" height="105" rx="14" class="core"/>
<text x="585.0" y="180" class="boxTitle" text-anchor="middle">BitmapBackbuffer</text>
<text x="585.0" y="207" class="small" text-anchor="middle">persistent SKSurface</text>
<rect x="710" y="145" width="170" height="105" rx="14" class="custom"/>
<text x="795.0" y="180" class="boxTitle" text-anchor="middle">UI dispatcher</text>
<text x="795.0" y="207" class="small" text-anchor="middle">marshal to UI thread</text>
<rect x="920" y="145" width="170" height="105" rx="14" class="custom"/>
<text x="1005.0" y="180" class="boxTitle" text-anchor="middle">Adapter.Present</text>
<text x="1005.0" y="207" class="small" text-anchor="middle">retain / copy image</text>
<rect x="1110" y="145" width="120" height="105" rx="14" class="platform"/>
<text x="1170.0" y="180" class="boxTitle" text-anchor="middle">Native surface</text>
<text x="1170.0" y="207" class="small" text-anchor="middle">paint pixels</text>
<line x1="250" y1="197" x2="280" y2="197" class="arrow"/>
<line x1="460" y1="197" x2="490" y2="197" class="arrow"/>
<line x1="670" y1="197" x2="700" y2="197" class="arrow"/>
<line x1="880" y1="197" x2="910" y2="197" class="arrow"/>
<line x1="1090" y1="197" x2="1100" y2="197" class="arrow"/>
<text x="640" y="285" class="label" text-anchor="middle">Frame lifecycle</text>
<rect x="110" y="325" width="1030" height="170" rx="18" class="muted"/>
<text x="160" y="365" class="boxTitle" text-anchor="middle">1</text>
<text x="190" y="365" class="boxText" text-anchor="start">Render dirty scene regions into BitmapBackbuffer.</text>
<text x="160" y="400" class="boxTitle" text-anchor="middle">2</text>
<text x="190" y="400" class="boxText" text-anchor="start">EndFrame → Snapshot() creates an immutable SKImage.</text>
<text x="160" y="435" class="boxTitle" text-anchor="middle">3</text>
<text x="190" y="435" class="boxText" text-anchor="start">Host posts adapter.Present(...) through the UI dispatcher.</text>
<text x="160" y="470" class="boxTitle" text-anchor="middle">4</text>
<text x="190" y="470" class="boxText" text-anchor="start">Adapter schedules/draws native paint and eventually disposes the SKImage.</text>
<text x="640" y="555" class="label" text-anchor="middle">Resize path</text>
<rect x="110" y="590" width="1030" height="120" rx="18" class="panel"/>
<text x="165" y="625" class="boxTitle" text-anchor="start">Native size change</text>
<text x="165" y="651" class="small" text-anchor="start">ignore transient 0×0</text>
<line x1="330" y1="632" x2="470" y2="632" class="arrow"/>
<text x="545" y="625" class="boxTitle" text-anchor="middle">SetDestinationSize</text>
<text x="545" y="651" class="small" text-anchor="middle">raises Resized</text>
<line x1="625" y1="632" x2="755" y2="632" class="arrow"/>
<text x="820" y="625" class="boxTitle" text-anchor="middle">Host requests resize</text>
<text x="820" y="651" class="small" text-anchor="middle">and scales viewports</text>
<line x1="940" y1="632" x2="1025" y2="632" class="arrow"/>
<text x="1085" y="625" class="boxTitle" text-anchor="middle">Next BeginFrame</text>
<text x="1080" y="651" class="small" text-anchor="middle">reallocates safely</text>
<text x="640" y="760" class="subtitle" text-anchor="middle">Adapter concern: presentation and image lifetime. Engine concern: rendering and dirty-region calculation.</text>
</svg>